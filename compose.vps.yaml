# VPS edge override: stack with the server and anvil reachable only on the docker
# network. This project has its OWN edge now — `deploy/edge/` — running as its own
# compose project on this project's network, publishing on the host's loopback
# only. It serves crucible.<host> and proxies /api/* to `api:8787` and
# <host>/api/* by service name, so nothing here publishes a host port - the
# origin is unreachable except through the edge, which is what keeps a
# Cloudflare-or-Let's-Encrypt edge trustworthy.
#
# The edge used to be another project's Caddy container, hand-attached to this
# network, and a recreate of it dropped the attachment. See
# `docs/adr/009-isolated-edge-per-project.md` in the other repository, and
# `deploy/edge/` here.
#
#   docker compose -f compose.yaml -f compose.vps.yaml up -d --build
#
# `!reset []` replaces compose.yaml's ports lists instead of merging with them
# (compose 2.24+; the tag is what makes a no-publish override possible at all).
#
# Restarting a single service must NOT let compose re-evaluate the seed: a second
# Demo broadcast on a running anvil lands at different addresses and the seed's
# assertion refuses it (correctly). Use `--no-deps`:
#
#   docker compose -f compose.yaml -f compose.vps.yaml up -d --no-deps web
#
# A full `up` is only for a fresh chain — take the stack down first.
#
# This override deliberately touches ONLY the published ports. It does not override `restart:`
# or `logging:`, so the deployed services inherit both policies from compose.yaml: compose
# merges per-service mappings, and a service the override re-declares just to `!reset` its ports
# keeps everything else. That is why the keeper restart fix reaches the real deployment even
# though `keeper` is not named here at all — it inherits, it is not redefined. `anvil`, `api` and
# `web` are re-declared only to un-publish their host ports.
services:
  anvil:
    # `ports` reset only; `restart: unless-stopped` and `logging` are inherited (see above).
    ports: !reset []

  api:
    ports: !reset []

  web:
    ports: !reset []
