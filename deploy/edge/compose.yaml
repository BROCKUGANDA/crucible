# The edge — this project's own reverse proxy.
#
# A SEPARATE compose project, deliberately.
#
# The application stack is deployed by `scripts/deploy-vps.sh` as a bare
# `docker run`, not by compose. So an edge service added to the app's compose
# file would be a service that the app's deploy path never reconciles, and a
# network membership that an app recreate would drop. This project's network
# is the thing the edge needs to reach `web`, `api` and `anvil` by name, and
# it has to survive an application recreate — so the edge is its own project,
# joined to the application's network as an EXTERNAL network.
#
# It is a separate project and not another service in the same one for a
# second reason: a project owns its containers and its network. An edge that
# belonged to the app's project would be torn down by the app's deploy, which
# is a public outage caused by an application release.
#
# The ports are LOOPBACK ONLY, and that is the security property, not a
# convenience. The origin is reachable from the internet only through the
# shared front door, which is the only process that binds the public :80 and
# :443. Nothing here is published on a routable address, so a request that
# has not been through the front door cannot reach this edge at all.
#
# The two host ports are reserved by the split:
#
#   8444  the TLS port  (the front door forwards SNI=crucible.svalley.tech here)
#   8081  the HTTP port (the front door forwards the Host header here, which
#         is how the ACME HTTP-01 challenge and the HTTP-to-HTTPS redirect
#         reach this edge)
#
# They are in `nginx/edge.d/crucible.sni.map` and `nginx/edge.d/crucible.host.map`
# in this directory, and `deploy/edge/provision.sh` fails loudly if the two
# ever disagree.
name: crucible-edge

services:
  caddy:
    image: caddy:2-alpine
    user: "1000:1000" # non-root
    restart: unless-stopped
    ports:
      - "127.0.0.1:8444:443"
      - "127.0.0.1:8081:80"
    cap_add:
      - NET_BIND_SERVICE
    environment:
      # ACME contact for certificate-expiry notices. This is the only Caddy
      # environment variable this edge reads.
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and the ACME account, so a restart does not re-issue.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      # THIS project's own network, and only that one. It is what makes the
      # names `web`, `api` and `anvil` resolve, and it is the reason this
      # edge can serve the application without being able to reach any other
      # project's containers.
      - crucible_default
    healthcheck:
      # Proves Caddy is SERVING, not that a particular path answers. This
      # edge deliberately serves no health path of its own — adding one would
      # change the public surface of the product — so a request for a
      # hostname Caddy does not serve answers 404, and a 404 still proves the
      # process is up and bound.
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1/ 2>&1 | grep -qE 'HTTP/1\\.[01] [0-9]{3}'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        # Bounded per-service log disk. The app is a separate container with
        # its own rotation; this cap is for the edge alone.
        max-size: "10m"
        max-file: "3"

  # The public RPC's method gate (gate 898). Sits between Caddy and the
  # node: wallet methods pass, the node's control namespaces are refused.
  # Holds no key, signs nothing, publishes no host port.
  rpc-gate:
    image: node:22-alpine
    command: ["node", "/gate/gate.mjs"]
    restart: unless-stopped
    environment:
      RPC_GATE_UPSTREAM: http://anvil:8545
      RPC_GATE_PORT: "8791"
    volumes:
      - ./rpc-gate:/gate:ro
    networks:
      - crucible_default
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  crucible_default:
    # EXTERNAL, and it is THIS project's. The application stack is in it, and
    # the edge joins it rather than reaching into it by hand — a hand-made
    # attachment is exactly what a recreate drops.
    external: true

volumes:
  caddy-data:
  caddy-config:
