name: crucible

# The demo stack from scripts/demo.mjs, as containers: a fresh anvil, a one-shot
# seed that deploys the demo loop and publishes the addresses that actually landed,
# the API + indexer reading that chain, and the Next.js app. The anvil chain is
# deliberately stateless — every `compose up` is a fresh, deterministic chain, and
# the seed re-runs. Host ports are published so a browser on the host can reach
# everything; the web bundle's NEXT_PUBLIC_* constants are baked at build time from
# the same values in .env (see apps/web/Dockerfile).

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil"]
    # The block cadence is one knob, and it is the args — not a mode name. anvil reads its
    # command line and nothing else, so an ANVIL_MODE variable passed to the container would be
    # a control that controls nothing while looking like the thing that selected it. Empty
    # ANVIL_MODE_ARGS is what the live deployment runs today: no `--block-time`, so the chain
    # instant-mines. Two files reason about that fact and would need re-reading if it changed:
    # `apps/api/src/security.ts:107` and `apps/web/src/lib/chainClock.ts:16`.
    # For 1s blocks: ANVIL_MODE_ARGS=--block-time 1 --base-fee 1000000000 --chain-id 31337
    command: >
      --host 0.0.0.0
      --port 8545
      --silent
      ${ANVIL_MODE_ARGS:-}
    ports:
      - "${ANVIL_HOST_PORT:-8555}:8545"
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
    # Restart policy for the node. Read the persistence question honestly:
    #
    # The chain is DELIBERATELY stateless — there is no data volume, anvil keeps every block
    # in memory, and the stack's whole recovery story (see the top of this file and
    # .github/workflows/deploy.yml) is "a fresh `compose up` re-runs the one-shot seed against a
    # new deterministic chain". So a restart policy here cannot preserve anything: after a crash
    # or a host reboot anvil comes back EMPTY no matter which policy it carries.
    #
    # The policy still matters, though, and it is not "no": with `restart: "no"` a reboot leaves
    # the node down and the site silently 502s until someone notices. `unless-stopped` brings the
    # node back so the box is at least reachably up. What it CANNOT do is make a reboot
    # self-healing — a lone anvil restart comes back with no contracts at the addresses the seed
    # published, and the keeper/api will index an empty chain until an operator runs a FULL
    # `docker compose up` (which re-runs the seed). That gap is called out plainly rather than
    # papered over: making a bare anvil restart correct would require a chain data volume this
    # demo deliberately does not have.
    restart: unless-stopped
    logging: &log-rotation
      driver: json-file
      options:
        # Bounded per-service log disk. The demo churns logs continuously (health probes, sweeps,
        # request lines) and no driver was set before, so json-file grew unbounded against the host
        # disk. 10 MB/file x 3 files = ~30 MB ceiling per long-running service (~90 MB across the
        # four), which is enough recent history to debug a crash without risking the disk that ran
        # the deploy out of space once. `anvil` runs `--silent` so it barely writes, but it shares
        # the cap so nothing here is unlimited.
        max-size: "10m"
        max-file: "3"

  seed:
    build:
      context: .
      dockerfile: crucible-contracts/Dockerfile
    environment:
      SEED_RPC_URL: http://anvil:8545
      EXPECTED_TRIALS_ADDRESS: ${TRIALS_ADDRESS:-}
      EXPECTED_ALLOY_ADDRESS: ${ALLOY_ADDRESS:-}
    volumes:
      - deployed:/run/crucible
    depends_on:
      anvil:
        condition: service_healthy
    # A one-shot on purpose. The seed broadcasts the demo deployment and publishes the
    # addresses that landed; `restart: "no"` is deliberate and load-bearing: a re-run would
    # broadcast a SECOND Demo onto whatever chain is live and land it at different addresses,
    # which is exactly the double-seed the VPS override's `--no-deps` guidance is built to
    # avoid. It gets no restart policy and no log cap because it exits, and a finished
    # container does not churn disk the way the four services beside it do.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # The API reads its configuration from the host's `.env`, and compose only
    # passes on what is named here. The list used to be the chain's addresses
    # and nothing else, so every other variable the `.env` documents —
    # AUTH_SECRET, AUTH_ORIGIN, TRUST_PROXY — stopped at the host and never
    # reached the process. The API ran with the defaults, which for the
    # limiter is "every visitor behind the proxy shares one bucket".
    #
    # `env_file` passes the whole file, so a variable the `.env` gains later
    # reaches the process without another edit here. The explicit
    # `environment` block still wins for the values compose owns.
    env_file:
      - path: .env
        # Not required: a fresh clone without a `.env` should still come up,
        # with the API's own defaults. `required: false` says so explicitly
        # rather than failing the whole stack on a missing file.
        required: false
    environment:
      NODE_ENV: production
      PORT: 8787
      RPC_URL: http://anvil:8545
      TRIALS_ADDRESS: ${TRIALS_ADDRESS:-}
      ALLOY_ADDRESS: ${ALLOY_ADDRESS:-}
      FROM_BLOCK: "0"
      # How often the index asks the node for new logs, and therefore the biggest single
      # term in how long a visitor waits to see a chain event happen. Here the node is a
      # container on the same bridge network, so asking four times as often costs the local
      # loopback almost nothing and cuts the wait by 1.5s. Against a public RPC the code
      # default of 2000 is the right number, which is why this is set per deployment
      # rather than baked into the API.
      SCRIBE_POLL_MS: ${SCRIBE_POLL_MS:-500}
      # The chain this deployment signs for, and the origin it names in the
      # sign-in message. Both are configuration rather than something the
      # request may say.
      CHAIN_ID: ${CHAIN_ID:-31337}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-}
      # The secret itself is NOT set here: a deployment that has not been
      # given one must get a 503 from the auth routes, not a session signed
      # with a fallback.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_ALLOW_DEV_SECRET: ${AUTH_ALLOW_DEV_SECRET:-}
      # The proxy in front overwrites X-Real-IP and X-Forwarded-For, so the
      # limiter can key on the real client instead of on the proxy's address.
      TRUST_PROXY: ${TRUST_PROXY:-0}
      # Where the disclosure log lives: `<dir>/disclosure/disclosure.json`, written by the
      # seat through `DisclosureLog.open(join(dir, "disclosure"))`. Without the mount and this
      # variable the API cannot see a single announced CID, so every trial says "suite not
      # disclosed yet" — which is what the live page said until 2026-10-26 even though the
      # juror had written the file 43 hours earlier.
      CRUCIBLE_CONTENT_DIR: /content
      # The funder is a compose service; the host's FUNDER_URL is for host-run scripts.
      FUNDER_URL: http://funder:8788
    ports:
      - "${API_HOST_PORT:-8787}:8787"
    volumes:
      - deployed:/run/crucible:ro
      # Read-only on purpose: the API resolves digests to CIDs, it never announces one. The
      # juror remains the only writer, so a reader bug cannot corrupt the log it reads.
      - content:/content:ro
    depends_on:
      anvil:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Long-running read service: after a crash or a host reboot it must come back on its own,
    # or the site serves 502s with nothing telling anyone. `unless-stopped` over `always`
    # because an operator who deliberately `docker compose stop api`s should not have dockerd
    # resurrect it on its next bounce — but both survive a reboot, which is the point.
    restart: unless-stopped
    logging: *log-rotation

  # The Warden as a service: quenches trials whose windows closed. Permissionless actions
  # signed by a bystander key. The key comes from KEEPER_PRIVATE_KEY -> PRIVATE_KEY; there is
  # no silent demo default any more. `apps/keeper` will only fall back to Anvil's published dev
  # key when the RPC is provably a loopback node reporting chain 31337, so THIS service — which
  # talks to the `anvil` container over the compose network, a non-loopback host — must be given
  # KEEPER_PRIVATE_KEY or it refuses to start. Publishes no port on the VPS override.
  keeper:
    build:
      context: .
      dockerfile: apps/keeper/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8789
      RPC_URL: http://anvil:8545
      TRIALS_ADDRESS: ${TRIALS_ADDRESS:-}
      ALLOY_ADDRESS: ${ALLOY_ADDRESS:-}
      # Empty on every host where the arena is not deployed; the crank loop is not created then.
      ARENA_ADDRESS: ${ARENA_ADDRESS:-}
      FROM_BLOCK: "0"
      PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}
      # The floor at which /health says this wallet is low. Passed through rather than defaulted:
      # empty means "publish the balance, raise no alarm", and a threshold set here in the file
      # would be this repository deciding what someone else's signer is worth.
      KEEPER_MIN_BALANCE_WEI: ${KEEPER_MIN_BALANCE_WEI:-}
      # The trace spine. Only sweeps that actually acted are recorded, so an idle demo adds
      # nothing to the file — a line here means a trial was finalized or reclaimed, or an
      # action was skipped, with the reason. It is a projection of things the chain already
      # decided, never a source of truth, and the keeper's appends are guarded so a full disk
      # records a missing line instead of stopping settlements.
      CRUCIBLE_TRACE_FILE: /trace/keeper.jsonl
    volumes:
      - trace:/trace
      # The same file the API's entrypoint sources. Without it the keeper reads
      # TRIALS_ADDRESS/ALLOY_ADDRESS from this template, so a restart after a re-seed
      # would sweep an address the chain no longer holds while the API reads the new one.
      - deployed:/run/crucible:ro
    depends_on:
      anvil:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8789/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 30
    # THE fix of this pass. Without a policy the keeper ran under Docker's default `no`: one
    # crash, or one VPS reboot, and it stayed down silently — nothing finalized or refunded
    # trials and the stack still reported itself healthy, because every other container was up.
    # `unless-stopped` makes the deployed keeper survive a reboot. The deploy pipeline now
    # recreates the keeper alongside web and api (`--no-deps`, so anvil keeps its chain) and
    # waits for this healthcheck before it calls the deploy done, which is what stops a
    # deployed keeper from aging silently behind the repository.
    restart: unless-stopped
    logging: *log-rotation

  # One Argus seat, as a service. The committee is the product's answer to "who decides", and until
  # now that answer was a library: `LiveVerifier`, `ContentService` and the commit/reveal calls all
  # existed, `ArgusSeat` had no importer anywhere in the repository, and a skeptic's challenge on a
  # live chain could only ever be settled by a demo key held by whoever ran the box. This is the
  # production caller that closes that gap: it reads a Challenged trial, fetches the content the
  # trial committed to, re-runs the pinned suite, and commits a verdict — then reveals it once a
  # second seat has sealed (ADR-0004's anti-collusion rule, which is why the count comes from the
  # `VoteCommitted` logs rather than from the seat's own eagerness).
  # The funder holds the CDP credential (ADR-0015). It starts even with none: `/health` says
  # `configured:false`, and `/allocate` and `/onramp/session` refuse with that reason instead
  # of the container crash-looping. To enable it, set `CDP_ENV` plus the matching `_API_KEY_ID`
  # and `_API_KEY_SECRET` (or a mounted `_API_KEY_FILE`) in the host `.env`; the entrypoint
  # configures the CDP CLI profile from them. No host port: only the API reaches it.
  funder:
    build:
      context: .
      dockerfile: apps/funder/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      FUNDER_HOST: 0.0.0.0
      FUNDER_PORT: 8788
      IDENTITY_API_URL: http://api:8787
      CDP_ENV: ${CDP_ENV:-sandbox}
      CDP_SANDBOX_API_KEY_ID: ${CDP_SANDBOX_API_KEY_ID:-}
      CDP_SANDBOX_API_KEY_SECRET: ${CDP_SANDBOX_API_KEY_SECRET:-}
      CDP_SANDBOX_API_KEY_FILE: ${CDP_SANDBOX_API_KEY_FILE:-}
      CDP_LIVE_API_KEY_ID: ${CDP_LIVE_API_KEY_ID:-}
      CDP_LIVE_API_KEY_SECRET: ${CDP_LIVE_API_KEY_SECRET:-}
      CDP_LIVE_API_KEY_FILE: ${CDP_LIVE_API_KEY_FILE:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # node:22-slim has node, not wget; the healthcheck uses the runtime it has.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *log-rotation

  juror:
    build:
      context: .
      dockerfile: apps/juror/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8790
      RPC_URL: http://anvil:8545
      TRIALS_ADDRESS: ${TRIALS_ADDRESS:-}
      ALLOY_ADDRESS: ${ALLOY_ADDRESS:-}
      CHAIN_ID: ${CHAIN_ID:-31337}
      FROM_BLOCK: "0"
      # The seat key, and no default for it. Anvil's dev mnemonic is public, so a fallback would
      # not be a convenience — it would be a voting key everyone in the world can derive, silently
      # used by a service that reports itself healthy. `config.ts` refuses an unset value.
      SEAT_PRIVATE_KEY: ${JUROR_SEAT_PRIVATE_KEY:-}
      CONTENT_DIR: /content
      STATE_DIR: /state
      CRUCIBLE_CONTENT_DIR: /content
      PATROL_MS: ${JUROR_PATROL_MS:-30000}
      # The re-run budget has to fit inside the commit window the contract enforces (24h from the
      # dispute opening) with room for the rest of the pass, and the seat checks its own margin
      # before it starts a suite it cannot finish.
      REVERIFY_MS: ${JUROR_REVERIFY_MS:-900000}
    volumes:
      # Two volumes, and the second is the reason the service can be restarted at all.
      #
      # `content` is the pinned bytes. The entrypoint fills it from the fixtures in the image before
      # the first pass and refuses to start if the digests do not answer to them, so this is the
      # only writer of a hash-chained disclosure log — running a second seat against the same mount
      # would be two processes appending to one chain, and each seat gets its own service (and its
      # own store) instead of sharing this one.
      #
      # `state` holds each sealed vote together with the salt that opens it. Losing it is not a
      # restart inconvenience: the chain remembers the commitment and `commitVote` refuses a second
      # one from the same seat (CrucibleTrials.sol:559), so a seat that loses a salt can neither
      # reveal nor replace that vote — it is mute on the dispute for the life of the chain.
      - content:/content
      - juror-state:/state
    depends_on:
      anvil:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8790/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *log-rotation

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8787}
        NEXT_PUBLIC_CHAIN: ${NEXT_PUBLIC_CHAIN:-foundry}
        NEXT_PUBLIC_TRIALS_ADDRESS: ${TRIALS_ADDRESS:-}
        NEXT_PUBLIC_ALLOY_ADDRESS: ${ALLOY_ADDRESS:-}
        # The browser's wallet needs an RPC for the demo chain. Local compose points
        # at the host-published anvil; a server deployment overrides it in .env with
        # the public proxied path (e.g. https://host/anvil).
        NEXT_PUBLIC_ANVIL_RPC: ${NEXT_PUBLIC_ANVIL_RPC:-http://127.0.0.1:${ANVIL_HOST_PORT:-8555}}
        # Empty hides the sponsor on-ramp. The provider URL is configuration; the escrow
        # still settles in native ETH and never holds the purchase.
        NEXT_PUBLIC_ONRAMP_URL: ${NEXT_PUBLIC_ONRAMP_URL:-}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *log-rotation

volumes:
  deployed:
  # Survives a keeper restart so the hash chain continues rather than restarting at genesis;
  # two chains in two files would each verify and neither would be the record.
  trace:
  # The pinned trial bytes (see the `juror` service). Content-addressed and regenerable from the
  # repository's fixtures, but a volume rather than a per-boot re-pin: the disclosure log is an
  # append-only chain, and one writer over its lifetime is the simpler true statement.
  content:
  # The seats' sealed votes and their salts. Never a bind mount of a host directory that might be
  # cleaned: this is the only copy of the opening to a commitment the chain still holds.
  juror-state:
