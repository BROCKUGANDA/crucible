# Gitleaks configuration.
#
# The allowlist contains only deterministic development values that are published by
# Anvil, plus the secp256k1 curve constants used by the signature check, plus the
# retired fixture literals named below. None of them is a credential: an Anvil key controls
# only a throwaway local account, the curve constants are public mathematics, and a
# retired literal is a string that was invented for a test and never controlled anything.
# Everything else is scanned, including git history.
[extend]
useDefault = true

[allowlist]
description = "Anvil development keys and secp256k1 constants"
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''',
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''',
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''',
  '''0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''',
  '''0x7FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF5D576E7357A4501DDFE92F46681B20A0''',
  '''0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEBAAEDCE6AF48A03BBFD25E8CD0364141''',
  # A 64-hex string invented as "a different key" in `packages/argus/test/live.test.ts`. It is not
  # a credential and it holds nothing, but a random hex literal is what a leaked credential looks
  # like, so gitleaks is right to stop the build over it — and it stops EVERY build, because this
  # job scans `--log-opts=--all`, so any branch's history reddens every PR.
  #
  # The fixture now uses Anvil's published dev key #2 instead, so nothing new looks like this.
  # This entry exists only because the value is already in pushed history: `git log -S` finds
  # commit 44fae44556c2fe601cb7b82651cc8b161ccb7eeb, and history that has been published is not
  # rewritten from a CI config. Exception is the exact literal, so any other key-shaped string —
  # including one that differs from this by a character — still fails.
  '''0x59c6995e998f97a51e2767c046f5c6b7b42d0c4d95c3c6b7a5e2d1c0b9a8f7e6''',
  # A second invented "different key" literal: `const SECRET` in `grader/test/frontier-layer.test.ts`
  # at commit c2d6b1e, used to prove the frontier layer scrubs a key-shaped string out of a model
  # card. It is not Anvil key #1 and not any published dev key (26 of its 66 characters differ), it
  # appears in no other commit, and the fixture was removed from the tree afterwards — but the
  # commit is published and this job scans `--log-opts=--all`, so it reddens every branch until it
  # is named. Exception is the exact literal; any other key-shaped string still fails.
  '''0x59c6995e998f97a5a0044966f0945389dc98a1073772777215dc9d3f5d5d0b4f''',
  # A random 32-byte team key invented for the `/teams` view-model fixture at
  # apps/web/test/teams-view.test.ts in commit 476e005. It names no account and signs nothing —
  # the fixture only needs a key-shaped field — but it is high-entropy hex, which is what a leaked
  # credential looks like, and gitleaks scans `--log-opts=--all`, so it reddened every branch.
  # The fixture now uses a repeated byte instead; this entry exists only for the published commit.
  # Exception is the exact literal, so any other key-shaped string still fails.
  '''0x53228c6de8ea8e72bc48ccf8e7ce7899cbb5490d296b84a8cae9b89731d43e3b''',
  # The localStorage slot the engram vault reads and writes: `const STORAGE_KEY =
  # "crucible.engram.vault.v1"` in `apps/web/src/app/engrams/page.tsx`, added in commit
  # 75c4643. It is a browser storage key - a name the page invents for itself - and it
  # controls no account, signs nothing and grants no access. It tripped gitleaks'
  # generic-api-key rule only because the value sits next to an identifier ending in
  # `_KEY`, and the rule scores the entropy of the string rather than what it is for.
  #
  # The identifier is now `VAULT_STORAGE_ID`, so nothing new looks like a key. This
  # entry exists only because the commit is published and the job scans
  # `--log-opts=--all`, so the old assignment reddens every branch until it is named.
  # Exception is the exact literal, so any other key-shaped string still fails.
  '''crucible\.engram\.vault\.v1''',
  # A third invented "a different key" literal: `const OPERATOR_KEY` in
  # `packages/eval/test/deploy-network.test.ts` at commit b253f33c, used to prove the deploy
  # plan does not leak a key-shaped value into its own output. It is not Anvil key #1 and not
  # any published dev key (it borrows key #1's first bytes, which is what made it look like
  # one), it appears in no other commit, and it controls nothing - but a high-entropy hex
  # string is what a leaked credential looks like, and this job scans `--log-opts=--all`, so
  # the published commit reddens every branch until the literal is named.
  #
  # The fixture now uses Anvil's published dev key #1 instead, so nothing new looks like
  # this. Exception is the exact literal, so any other key-shaped string still fails.
  '''0x59c6995e998f97a5a0044966f094533579aee81dd4dbbe82c73bec743c0b44a7''',
]
