name: release

# Every deploy that reached `main` and passed its own probes is a release. The tag is computed
# from the highest `vX.Y.Z` already in the repository (scripts/version.mjs), so the number is a
# fact about git rather than a constant someone remembers to edit.
#
# It is asked for by name from `deploy`, not hung off `deploy`'s completion. The first version of
# this file used a `workflow_run` trigger and the ladder never fired it: `deploy` is itself started
# with `workflow_dispatch` (the promotion job asks for it explicitly, because a push made with
# GITHUB_TOKEN raises no event), and a dispatched run raises no downstream `workflow_run` either.
# Measured on 2026-10-25 — every chained deploy had created a release run, and the one that shipped
# the site created none. Same rule the promotion had to learn, one rung further down.
#
# Asking by name also keeps the failed-deploy case honest without reading a conclusion: the step in
# `deploy` is a normal step, so a deploy that stops at a probe stops before the ask, and a deploy
# that reaches the ask then waits for the tag and goes red if it fails.
#
# It runs on the ladder's own runner because git and gh are there, and a repository with self-hosted
# runners does not need a hosted one to push a tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # Tags are the input to the computation, so the checkout cannot be shallow.
          fetch-depth: 0

      # A tag is a claim about a commit. If main moved while this job waited in the queue, the
      # deploy that just finished is no longer the tip, and tagging the new tip would attach an
      # old deploy's release to someone else's commit.
      - name: refuse a release on a tree that is not main's tip
        run: |
          set -euo pipefail
          git fetch -q origin main
          head="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if [ "$head" != "$main" ]; then
            echo "::error::checked out $head but origin/main is $main; refusing to tag a stale tree"
            exit 1
          fi

      - name: tag it, push the tag, and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          tag="$(node scripts/version.mjs --bump "$BUMP" --apply)"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag"
          echo "released $tag"
