name: edge

# Inspects and repairs the shared edge that fronts crucible.svalley.tech.
#
# The site is served by the shared Caddy — another project's container — which
# is attached to this stack's compose network so it can reach `web:3000` and
# `api:8787` by service name. That attachment is not part of either project's
# compose file: it is made by hand, and it does not survive the edge being
# recreated. When the edge came back after a deploy on the other project, it
# came back without the attachment, and every request for this site answered
# 502 while every container in this stack reported itself healthy.
#
# This workflow reads the edge's view, repairs the attachment, and proves the
# result from inside the edge container as well as from outside.

on:
  # Every five minutes, because the attachment is not held by anything this
  # project owns: the edge belongs to another project's compose file, and a
  # deploy there recreates the container and drops the attachment. Nothing
  # about that deploy announces it, and the symptom here — 502 on every
  # request while every container in this stack reports itself healthy — reads
  # as an outage in this project rather than as a severed network attachment.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      repair:
        description: "Re-attach the edge to this stack's network if it is detached"
        type: boolean
        default: true

concurrency:
  group: edge
  cancel-in-progress: false

jobs:
  edge:
    name: Edge attachment
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - name: the edge's view of this stack
        run: |
          set -uo pipefail
          cd "$HOME/crucible"

          echo "=== compose networks ==="
          docker network ls --format '{{.Name}}' | grep -i crucible || true

          echo "=== containers ==="
          docker ps --format '{{.Names}}' | grep -iE 'caddy|web|api|anvil' || true

          echo "=== which networks each edge container is on ==="
          for c in $(docker ps --format '{{.Names}}' | grep -i caddy || true); do
            echo "--- $c"
            docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}  {{$k}} ({{$v.IPAddress}}){{end}}' "$c"
          done

          echo "=== the site block, if the edge still has one ==="
          for c in $(docker ps --format '{{.Names}}' | grep -i caddy || true); do
            echo "--- $c"
            docker exec "$c" sh -c 'ls -la /etc/caddy/sites.d/ 2>/dev/null; cat /etc/caddy/sites.d/*.caddy 2>/dev/null' || true
          done

      - name: repair the attachment
        if: ${{ inputs.repair != false }}
        run: |
          set -uo pipefail
          cd "$HOME/crucible"

          NET=$(docker network ls --format '{{.Name}}' | grep -E '^crucible_default$' | head -n 1)
          if [ -z "$NET" ]; then
            NET=$(docker network ls --format '{{.Name}}' | grep -i crucible | head -n 1)
          fi
          if [ -z "$NET" ]; then
            echo "::error::no crucible network found"
            exit 1
          fi
          echo "stack network: $NET"

          for c in $(docker ps --format '{{.Names}}' | grep -i caddy || true); do
            if docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c" | grep -q "$NET"; then
              echo "$c is already on $NET"
            else
              echo "attaching $c to $NET"
              docker network connect "$NET" "$c" || echo "  (attach failed)"
            fi
          done

      - name: install the host timer
        run: |
          set -euo pipefail
          cd "$HOME/crucible"

          # The repair lives on the HOST, on a timer, rather than in this
          # workflow.
          #
          # A schedule in GitHub Actions waits for a runner, and the runners
          # here are busy — a schedule that arrives late is the same as no
          # schedule when the thing it repairs takes minutes to notice. It
          # also depends on this project's deploy pipeline, and the attachment
          # is dropped by a deploy of a DIFFERENT project: nothing about this
          # project happens at that moment, so nothing here would notice.
          #
          # A host cron entry has neither dependency. It runs whether or not
          # this repository is touched.
          if [ ! -f deploy/edge-attach.sh ]; then
            echo "::warning::deploy/edge-attach.sh is not in this checkout yet; the timer was not installed"
            echo "::warning::the next deploy syncs the tree, and running this job again installs it"
            exit 0
          fi
          sudo install -m 0755 deploy/edge-attach.sh /usr/local/bin/crucible-edge-attach
          ( crontab -l 2>/dev/null | grep -v 'crucible-edge-attach' ; \
            echo '*/2 * * * * /usr/local/bin/crucible-edge-attach >> /var/log/crucible-edge-attach.log 2>&1' \
          ) | crontab -
          echo "=== crontab ==="
          crontab -l | grep crucible-edge-attach || echo "  (not installed)"
          echo "=== running it once ==="
          /usr/local/bin/crucible-edge-attach || true

      - name: prove it
        run: |
          set -uo pipefail
          for c in $(docker ps --format '{{.Names}}' | grep -i caddy || true); do
            echo "--- $c"
            docker exec "$c" sh -c 'wget -qO- --timeout=5 http://api:8787/health 2>&1 | head -c 200' || echo "  (no answer from api:8787)"
          done

          # The check is a GATE, not a report.
          #
          # This job runs every five minutes, so a red run is the alarm: a
          # reader sees the pipeline go red at the same moment a visitor sees
          # a 502. A step that only printed the status would leave the
          # difference between "the site is down" and "the site is down and
          # nobody was told" entirely in the reader's memory.
          echo "=== from outside ==="
          fail=0
          for probe in \
            "site=https://crucible.svalley.tech/" \
            "ready=https://crucible.svalley.tech/api/ready" \
            "health=https://crucible.svalley.tech/api/health"; do
            name="${probe%%=*}"
            url="${probe#*=}"
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "$name  $code  $url"
            case "$code" in
              200) ;;
              *) fail=1 ;;
            esac
          done
          if [ "$fail" != "0" ]; then
            echo "::error::a probe on the judge path is not answering 200"
            exit 1
          fi
          echo "every probe on the judge path is answering 200"
