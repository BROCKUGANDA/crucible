name: ci

on:
  push:
    branches: [main, develop, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Foundry by pinned tarball, not foundryup: the runner box also hosts the
      # production anvil, and foundryup refuses to replace its binaries while
      # any foundry process is running. The tarball lands in this job's own
      # temporary directory and joins PATH, so it never touches the host's
      # ~/.foundry and never collides with the other jobs' copy.
      #
      # The digest lives in `scripts/install-tool.sh`, not here, and that file is what
      # actually compares it. This step used to be named "pinned tarball" while the body
      # piped the download straight into `tar` — the pin was the version tag, and a
      # re-uploaded asset would have passed. One tool, one version, one digest, one file.
      - name: install foundry (digest-pinned tarball)
        run: |
          set -euo pipefail
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" foundry "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      - name: deployment assertion shell syntax
        run: sh -n scripts/assert-deployment.sh

      - name: forge fmt --check
        run: forge fmt --check

      - name: build
        run: forge build --sizes

      - name: test
        run: |
          set -o pipefail
          # A seed derived from the run id, echoed so the log states the replay command, with the
          # campaign held to ONE worker so a replay has fewer moving parts than an auto-sized
          # fan-out across however many cores the runner happens to have.
          #
          # Being straight about what this buys: when a conservation invariant failed once on
          # `develop`, the seed forge printed did NOT bring the failure back locally - not at 1,
          # 2, 4 or 8 workers, not under the same pinned forge v1.8.5 and the same
          # `coverage --ir-minimum`. 40-plus attempts found nothing. So do not read a clean replay
          # here as proof the original run was wrong; the honest position is that a printed seed has
          # not yet been shown to be sufficient, which is exactly why the campaign state is
          # uploaded below instead of trusted to a log line.
          SEED=$(printf '0x%064x' "${{ github.run_id }}")
          echo "fuzz seed: $SEED"
          echo "replay with: forge test -vv --fuzz-seed $SEED --invariant-workers 1"
          forge test -vv --fuzz-seed "$SEED" --invariant-workers 1

      - name: gas report
        run: forge test --gas-report | tee gas-report.txt

      # Coverage runs with `--ir-minimum`: forge disables the optimizer and viaIR for
      # coverage reports, and the legacy codegen then hits "stack too deep" in this
      # codebase. `--ir-minimum` keeps viaIR on with minimum optimization, which is what
      # the contracts are built with anyway, so the coverage numbers describe the code
      # that actually ships. It is slower.
      #
      # `set -o pipefail` is load-bearing: without it the pipeline reports `tee`'s exit
      # code, so a forge that crashed halfway through looked like a successful coverage
      # run. forge has no threshold flag (verified against forge 1.8.5), which is why the
      # floor lives in the next step rather than in a flag that does not exist.
      - name: coverage
        run: |
          set -o pipefail
          # Same seed and worker count as the test step, where the limits of that handle are
          # stated honestly. This is the step that actually caught the invariant.
          SEED=$(printf '0x%064x' "${{ github.run_id }}")
          echo "fuzz seed: $SEED"
          echo "replay with: forge coverage --ir-minimum --report summary --fuzz-seed $SEED --invariant-workers 1"
          forge coverage --ir-minimum --report summary --fuzz-seed "$SEED" --invariant-workers 1 \
            | tee coverage-summary.txt

      # The floor gate is per production contract, not the `Total` row: the total is 66.5%
      # because `script/*.sol` are 0% by design (they are exercised by the demo and the
      # deployment assertion, not the unit suite). A single number on the total would have
      # to be set low enough to pass regardless, which is another way of saying it could
      # not fail. See scripts/coverage-gate.mjs for the floors and the targets behind them.
      - name: coverage floor gate
        run: node ../scripts/coverage-gate.mjs coverage-summary.txt

      # What a shrunk invariant counterexample is worth was learned the hard way: forge reported
      # `original: 4, shrunk: 1` for a conservation failure and printed that single call, and the
      # call does not fail the invariant when replayed by hand (a self-funded `registerAgent`
      # leaves balance and books equal, and a second one reverts `AlreadyRegistered`). Whatever the
      # shrunk line was pointing at, it was not a reproducible cause. foundry.toml already persists
      # campaigns to `failure_persist_dir` (`cache/invariant`, `cache/fuzz`); CI never collected
      # them, so the only surviving evidence was the misleading shrunk line. Upload them on any red
      # so the next failure can be read rather than reasoned about. `if-no-files-found: ignore`
      # because most failures produce no campaign state at all (a compile error, a floor miss).
      - name: upload campaign state
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: forge-campaign-state-run-${{ github.run_id }}
          path: |
            crucible-contracts/cache/invariant
            crucible-contracts/cache/fuzz
          if-no-files-found: ignore
          retention-days: 30

  # Static analysis. Findings are triaged by hand in docs/slither-triage.md -- this job
  # proves nothing NEW appeared, it does not decide what is acceptable.
  slither:
    name: Static analysis (slither)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # See the contracts job: a pinned tarball, because foundryup cannot run
      # beside the production anvil.
      - name: install foundry (digest-pinned tarball)
        run: |
          set -euo pipefail
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" foundry "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install slither-analyzer

      - name: slither
        # Fails on any detector not already excluded in slither.config.json. Every
        # suppression is justified in that file; adding one requires justifying it
        # there too, which is the entire point.
        run: slither .

  # Fork tests prove the ERC-8004 bridge works against the registry as actually
  # deployed, which a mock cannot. Separate from the default suite because it needs a
  # live RPC, and a gate that depends on a third party's uptime is not a gate.
  fork:
    name: Fork tests (ERC-8004 mainnet)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install foundry (digest-pinned tarball)
        run: |
          set -euo pipefail
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" foundry "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      # The README keeps these out of the default gate on purpose: a gate that
      # depends on a third party's RPC is not a gate. But exiting 0 while running
      # nothing is how a skipped check reads as a passed one, and HARDENING.md's
      # open list already admits the bridge "has never been exercised against the
      # registry as actually deployed". So: say plainly, in the run's own output,
      # that this proves nothing, and let fork-nightly.yml be the job that does
      # run it on a schedule with the credential attached.
      - name: fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::warning::FORK TESTS DID NOT RUN — no MAINNET_RPC_URL. This check is green because it was skipped, not because the ERC-8004 bridge works."
            {
              echo "## Fork tests: SKIPPED, not passed"
              echo ""
              echo "No \`MAINNET_RPC_URL\` is configured for this run, so the four ERC-8004 fork"
              echo "tests did not execute. A green tick here is not evidence that the bridge works"
              echo "against the registry as deployed. \`fork-nightly.yml\` runs them on a schedule"
              echo "and treats a missing credential as a failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          forge test --fork-url "$MAINNET_RPC_URL" --match-contract ForkTests -vv

  # Leaked credentials are the one class of defect that is already too late by the time
  # tests run. The whole history is scanned, not just the working tree; the only
  # suppressions are the deterministic Anvil keys and secp256k1 constants listed in
  # .gitleaks.toml, each with the reason it is not a secret.
  secrets:
    name: Secrets (gitleaks)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install gitleaks (digest-pinned tarball)
        run: |
          set -euo pipefail
          # GitHub's release-asset API returns `digest: null` for this gitleaks build, but the
          # release does publish `gitleaks_8.24.0_checksums.txt`, and its linux_x64 line equals
          # the value in scripts/install-tool.sh. That vendor file is the corroboration; Foundry's
          # is corroborated against the digest GitHub publishes. Both are compared before
          # anything is extracted either way.
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" gitleaks "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: scan history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="--all"

  # One job for every workspace, not a matrix per package: this repo runs on
  # two runners, and a ten-way matrix turns every push into a queue an hour
  # deep. The workspaces run in turn — same tests, one slot, a queue that drains
  # in minutes. All ten are named explicitly so a new workspace cannot be
  # silently skipped.
  node:
    name: TypeScript (all workspaces)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `api` and `web` import the workspace packages through their package `exports`,
      # which point at `dist/` — and `dist/` is gitignored. Without this step a clean
      # checkout fails typecheck with "Cannot find module '@crucible/smith'", so the job
      # could only ever pass on a machine that had already built. `prepare` does this on
      # `npm install` locally; CI is explicit about it instead.
      - name: build workspace libraries
        run: npm run build:libs

      # Gate 502 — the sandbox seal, enforced where a push cannot talk its way around it:
      # the agent module graph (the code an agent runs inside) must not reach fs,
      # child_process, net or any wallet library. The scanner is the built package itself,
      # so the gate lints exactly the code that ships.
      - name: import-lint — the agent module graph holds no effectors (gate 502)
        run: npm run lint:imports --workspace @crucible/forge-runner

      # Gate 732 (ADR-0011): every v2 arena number comes from params/crucible.params.json
      # through codegen. This proves the five derived invariants hold and that the
      # committed generated files match the JSON — hand-typed constants cannot hide.
      - name: params — invariants + drift check (gate 732)
        run: node scripts/params-codegen.mjs --check

      # The site index has the same shape of guarantee — a generated artifact that must
      # match the source it is generated from — but its drift step is NOT run here, and
      # the reason is recorded rather than forgotten: `scripts/site-index.ts` evaluates each
      # route's `site.ts` through `--import tsx/esm`, and on the runner's Node 20 that dies
      # with ERR_REQUIRE_CYCLE_MODULE before it reads a single descriptor (measured on run
      # 42114384899 — the step was green on the Node 24/26 boxes it was written on, which is
      # exactly the environment-premised gate this repository keeps finding). What CI *does*
      # enforce is `packages/site-index/test/site-index.test.ts`: every page of the site has
      # an entry, no entry names a route that does not exist, and every point an entry
      # promises is an id the page really carries. That is the failure that actually ships a
      # lying map. Wording drift inside a descriptor — a `purpose` reworded without
      # regenerating — is not caught here; `npm run site-index:check` is written for it and
      # runs on a machine whose loader can load the script.

      # Gate 752 (TS side): the committed golden vectors must be reproducible by the
      # live JCS implementation and pure per §2.7. Rust and Solidity answer the same
      # file in their own suites — this is the reference side of the parity triangle.
      - name: vectors — TS parity reference (gate 752)
        run: node scripts/vectors-check.mjs

      # The chain commits to two digests per trial. `script/SeedContent.sol` carries them as
      # generated constants so a foundry-only container can post them, which makes a cached value
      # load-bearing — so CI recomputes it from the fixture bytes every run and fails if the two
      # have parted. Without this step a fixture edit would put a digest on a chain that resolves
      # to nothing, and the only witness would be a skeptic who could not fetch the spec.
      - name: seed digests answer to the content they name
        run: npm run seed:check

      # Two lists below, and both are maintained by a gate rather than by memory:
      # `scripts/workspace-coverage-gate.mjs` reads the workspaces out of the repository and fails
      # if any of them has a script that this job does not run. The enumeration is not laziness —
      # `crucible-contracts` has `test` and `build` scripts that need forge, which this job does
      # not install (the Contracts job owns them) — but an enumerated list is a list that silently
      # forgets the next package. `apps/juror` is the one this repo nearly forgot: it arrived with
      # 70 tests that no job would have run.
      - name: every workspace is actually covered by this job
        run: node scripts/workspace-coverage-gate.mjs .github/workflows/ci.yml

      - name: typecheck (every workspace)
        run: |
          npm run typecheck \
            --workspace @crucible/smith \
            --workspace @crucible/forge-runner \
            --workspace @crucible/argus \
            --workspace @crucible/indexer \
            --workspace @crucible/warden \
            --workspace @crucible/agent-security \
            --workspace @crucible/cidstore \
            --workspace @crucible/forge-watch \
            --workspace @crucible/crypto \
            --workspace @crucible/frame \
            --workspace @crucible/arena-events \
            --workspace @crucible/forge-runner \
            --workspace @crucible/grader \
            --workspace @crucible/keeper \
            --workspace @crucible/juror \
            --workspace @crucible/api \
            --workspace @crucible/web \
            --workspace @crucible/datasets \
            --workspace @crucible/eval \
            --workspace @crucible/engrams \
            --workspace @crucible/registry \
            --workspace @crucible/site-index \
            --workspace @crucible/funder \
            --workspace @crucible/fork-host

      - name: start ephemeral redis + postgres for server-backed tests
        run: |
          set -euo pipefail
          docker rm -f crucible-ci-redis crucible-ci-pg >/dev/null 2>&1 || true
          docker run -d --name crucible-ci-redis -p 127.0.0.1:16379:6379 redis:7-alpine >/dev/null
          # Readiness is the host's TCP port, not `docker exec`. On the self-hosted
          # runners the shared VPS is heavily loaded (2026-11-12: ~40 containers from
          # six projects, several crash-looping), postgres can take seconds to init,
          # and `docker exec … pg_isready` proved flaky under that load — on the
          # 2026-11-12 main run it answered no while the container's own log read
          # "database system is ready to accept connections". The tests connect over
          # TCP to 127.0.0.1:15432, so that is what this waits for.
          pg_ready() { (exec 3<>"/dev/tcp/127.0.0.1/15432") >/dev/null 2>&1; }
          deadline=$(( $(date +%s) + 150 ))
          for attempt in 1 2 3; do
            docker rm -f crucible-ci-pg >/dev/null 2>&1 || true
            docker run -d --name crucible-ci-pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=crucible -p 127.0.0.1:15432:5432 postgres:16-alpine >/dev/null
            while [ "$(date +%s)" -lt "$deadline" ]; do
              if pg_ready; then break 2; fi
              sleep 2
            done
            echo "postgres attempt ${attempt} did not become ready; recreating the container" >&2
          done
          # Fail the job if either daemon never came up. Without this the loop times out, the URLs
          # are still exported, the probes refuse, and the server-backed cases report SKIPPED — a
          # green CI run that quietly stopped testing the real Redis/Postgres paths. "No skips" has
          # to mean the gate can fail, not that the skip banner is reassuring.
          if ! docker exec crucible-ci-redis redis-cli ping >/dev/null 2>&1; then
            echo "::error::ephemeral redis did not become ready; refusing to run server-backed tests as skips" >&2
            exit 1
          fi
          if ! pg_ready; then
            echo "::error::ephemeral postgres did not become ready after 3 attempts; refusing to run server-backed tests as skips" >&2
            # The refusal is the point, but a refusal nobody can act on is just a red
            # build. Dump the container's own answer before exiting.
            echo "--- docker ps -a ---" >&2
            docker ps -a >&2 || true
            echo "--- crucible-ci-pg logs ---" >&2
            docker logs crucible-ci-pg >&2 || true
            echo "--- crucible-ci-pg inspect (state + exit code) ---" >&2
            docker inspect crucible-ci-pg >&2 || true
            echo "--- docker info (space + driver) ---" >&2
            docker info >/dev/null 2>&1 && docker system df >&2 || true
            exit 1
          fi
          echo "REDIS_URL=redis://127.0.0.1:16379" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgres://postgres:ci@127.0.0.1:15432/crucible" >> "$GITHUB_ENV"
          echo "started redis + postgres"

      - name: test (every workspace)
        run: |
          npm test \
            --workspace @crucible/smith \
            --workspace @crucible/forge-runner \
            --workspace @crucible/argus \
            --workspace @crucible/indexer \
            --workspace @crucible/warden \
            --workspace @crucible/agent-security \
            --workspace @crucible/cidstore \
            --workspace @crucible/forge-watch \
            --workspace @crucible/crypto \
            --workspace @crucible/frame \
            --workspace @crucible/arena-events \
            --workspace @crucible/forge-runner \
            --workspace @crucible/grader \
            --workspace @crucible/keeper \
            --workspace @crucible/juror \
            --workspace @crucible/api \
            --workspace @crucible/web \
            --workspace @crucible/datasets \
            --workspace @crucible/eval \
            --workspace @crucible/engrams \
            --workspace @crucible/registry \
            --workspace @crucible/site-index \
            --workspace @crucible/funder \
            --workspace @crucible/fork-host

      # The edge is not a workspace, so `npm test --workspaces` never reaches it — and a
      # gate whose tests nobody runs is a gate that is not tested. The rpc-gate suite was
      # green on a developer laptop while the deployed edge proxied /anvil straight to the
      # node, which is the failure this step exists to make impossible: it runs the refusal
      # tests AND the provision/Caddyfile/compose wiring tests that read the executed
      # statements in deploy/edge/provision.sh.
      - name: cleanup ephemeral redis + postgres
        if: always()
        run: |
          docker rm -f crucible-ci-redis crucible-ci-pg >/dev/null 2>&1 || true

      - name: edge (rpc gate refusal + deployment wiring)
        run: npm run test:edge

      # ESLint lives only where the rules it can actually run exist: the web app
      # (react-hooks + core correctness). Type-level linting is `tsc --noEmit`
      # strict with noUnusedLocals/Parameters, which the typecheck step above
      # already runs for every workspace — that is the division of labor, and
      # the workspace-coverage philosophy says a script nobody runs is a script
      # that silently rots, so the lint script is wired here.
      - name: lint (web)
        run: npm run lint --workspace @crucible/web

  build:
    name: Build (next)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build --workspace @crucible/web

  trivy:
    name: Trivy (container image scan)
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Build the images this repo ships, so Trivy has something to scan. These are the
      # same images deploy.yml builds (web, api, keeper) — scanning them in CI means a
      # vulnerable layer fails the gate before it reaches the box. `--no-cache` is not
      # used: the runner's layer cache is the only thing keeping this job under 10 min.
      - name: build container images
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.vps.yaml build web api keeper funder 2>&1 | tail -20

      # The api image must carry its SQL migrations: the API reads /repo/migrations at
      # boot, and an image without them boot-loops (2026-11-09). The deploy asserts this
      # again before swapping; this keeps a regression from ever passing the gate.
      - name: assert the api image carries its migrations
        run: |
          set -euo pipefail
          if ! docker run --rm --entrypoint sh crucible-api:latest -c \
            'ls /repo/migrations/*.sql >/dev/null 2>&1'; then
            echo "::error::the api image contains no /repo/migrations/*.sql; it would boot-loop. Check apps/api/Dockerfile."
            exit 1
          fi
          echo "the api image carries /repo/migrations/*.sql"

      # Only the edge may publish a host port on the VPS. A manual `docker compose up`
      # without compose.vps.yaml once published the whole stack (2026-11-09); this
      # asserts the merged VPS config keeps every service unpublished, so a compose
      # regression fails the gate instead of the firewall.
      - name: assert no crucible service publishes a host port
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.vps.yaml config --format json > "$RUNNER_TEMP/crucible-compose.json"
          node -e '
            const cfg = require(process.env.RUNNER_TEMP + "/crucible-compose.json");
            let fail = 0;
            for (const [name, svc] of Object.entries(cfg.services ?? {})) {
              const published = (svc.ports ?? []).filter((p) => p.published !== undefined && p.published !== null && p.published !== 0);
              if (published.length > 0) {
                console.error(`::error::${name} would publish host port(s) ${published.map((p) => p.published).join(", ")}; only the edge may be reachable on the VPS.`);
                fail = 1;
              }
            }
            if (fail) process.exit(1);
            console.log("no crucible service publishes a host port in the VPS compose config");
          '

      # Trivy scans each image for OS-level and language-level vulnerabilities. The scan
      # exits non-zero on CRITICAL/HIGH by default; .trivyignore documents accepted risks.
      # `--severity` can be tightened to CRITICAL-only if the noise is too high initially.
      # The download goes through scripts/install-tool.sh, which refuses the tarball unless
      # it hashes to the digest recorded there — the same gate every other release download
      # in this repository passes, and the one no-orphan.test.ts enforces for all of them.
      - name: install trivy (digest-pinned)
        run: |
          set -euo pipefail
          TRIVY_DIR="$RUNNER_TEMP/trivy"
          mkdir -p "$TRIVY_DIR"
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" trivy "$TRIVY_DIR"
          echo "$TRIVY_DIR" >> "$GITHUB_PATH"
          export PATH="$TRIVY_DIR:$PATH"
          trivy --version

      - name: scan web image
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trivy:$PATH"
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            crucible-web:latest 2>&1 | tail -40

      - name: scan api image
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trivy:$PATH"
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            crucible-api:latest 2>&1 | tail -40

      - name: scan keeper image
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trivy:$PATH"
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            crucible-keeper:latest 2>&1 | tail -40

      - name: scan funder image
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trivy:$PATH"
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --ignorefile .trivyignore \
            --exit-code 1 \
            --format table \
            crucible-funder:latest 2>&1 | tail -40

      # Upload SARIF results for GitHub Security tab integration.
      - name: trivy (SARIF upload)
        if: always()
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/trivy:$PATH"
          for svc in web api keeper funder; do
            trivy image --severity CRITICAL,HIGH --ignore-unfixed \
              --ignorefile .trivyignore \
              --format sarif \
              --output "trivy-${svc}.sarif" \
              "crucible-${svc}:latest" 2>/dev/null || true
          done

      - name: upload SARIF artifacts
        if: always()
        # The artifact store has a quota; the scan gates above already decided the run.
        # An exhausted quota is a reporting failure, not a vulnerability finding.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: trivy-sarif-run-${{ github.run_id }}
          path: trivy-*.sarif
          if-no-files-found: ignore
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: [self-hosted, linux, X64, crucible]
    # A public repository must never execute a fork's code on this runner. The runner IS the
    # VPS that serves the site and holds its .env; `pull_request` runs the base branch's
    # workflow file, so a fork cannot remove this guard, but the code it checks out is still
    # the fork's. Same-repository branches (the ladder) keep running.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Node 24 here, and only here, because it is the audit client that broke, not the app.
      #
      # On 2026-10-22 every audit job began failing the same way, whatever the push contained:
      #   npm notice This endpoint is being retired. Use the bulk advisory endpoint instead.
      #   npm warn audit 400 Bad Request - POST .../-/npm/v1/security/audits/quick - Bad Request
      #   dependency audit FAILED: audit.json has no auditReportVersion
      # npm 10 posts to that retired endpoint, so the file the gate read was an error object rather
      # than an audit. The gate refused it instead of calling that clean — exactly the behaviour it
      # was written to have after the version that read an empty payload as "only documented
      # advisories" — and the fix is a client that asks the registry's current question.
      #
      # The versions are measured, not remembered: `deps/npm/package.json` on the node release
      # branches gives v22.x npm 10.9.9 and v24.x npm 11.19.1. An earlier revision of this step said
      # "node 22, because npm 11 uses the bulk endpoint", and the next run failed with the identical
      # 400 — node 22 does not ship npm 11. npm 11.19 was checked against a real payload: it reaches
      # `/security/advisories/bulk`, reports 26 vulnerable packages, and the gate reconciles that
      # against npm's own summary and passes every name under its ceiling.
      #
      # Deliberately NOT `npm i -g npm@11`: these are long-lived self-hosted runners, and a global
      # upgrade silently changes the npm every later job on that machine inherits. `npx npm@11` was
      # tried and fails before it reaches the audit (EALLOWSCRIPTS on a project-scoped install).
      # setup-node puts this version on one job's PATH and leaves the runner as it found it.
      - uses: actions/setup-node@v7

        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known-unfixable, and documented as such in the README's "Known limits":
      # the postcss advisory covers every released Next version through
      # 16.3.0-preview, and the wallet stack (RainbowKit 2.2.11 pins wagmi ^2.9)
      # cannot be patched without dropping RainbowKit for wagmi 3.
      #
      # `|| true` stays, because npm audit legitimately exits non-zero when anything is
      # vulnerable — but the decision now belongs to scripts/audit-gate.mjs, which is a
      # file rather than an inline blob so it can be run and mutation-tested locally.
      # That gate refuses a payload it cannot reconcile (an absent schema, or an entry
      # count that disagrees with npm's own summary) instead of reading it as "no new
      # advisories", and it caps every documented name by severity, so a critical in a
      # wallet package is no longer excused by its prefix.
      - name: audit (documented set, with severity ceilings)
        run: |
          npm audit --json > audit.json || true
          node scripts/audit-gate.mjs audit.json