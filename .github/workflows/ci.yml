name: ci

on:
  push:
    branches: [main, develop, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Foundry by pinned tarball, not foundryup: the runner box also hosts the
      # production anvil, and foundryup refuses to replace its binaries while
      # any foundry process is running. The tarball lands in this job's own
      # temporary directory and joins PATH, so it never touches the host's
      # ~/.foundry and never collides with the other jobs' copy.
      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          mkdir -p "$FOUNDRY_DIR"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      - name: forge fmt --check
        run: forge fmt --check

      - name: build
        run: forge build --sizes

      - name: test
        run: forge test -vv

      - name: gas report
        run: forge test --gas-report | tee gas-report.txt

      # Coverage runs with `--ir-minimum`: forge disables the optimizer and viaIR for
      # coverage reports, and the legacy codegen then hits "stack too deep" in this
      # codebase. `--ir-minimum` keeps viaIR on with minimum optimization, which is what
      # the contracts are built with anyway, so the coverage numbers describe the code
      # that actually ships. It is slower.
      #
      # `set -o pipefail` is load-bearing: without it the pipeline reports `tee`'s exit
      # code, so a forge that crashed halfway through looked like a successful coverage
      # run. forge has no threshold flag (verified against forge 1.8.5), which is why the
      # floor lives in the next step rather than in a flag that does not exist.
      - name: coverage
        run: |
          set -o pipefail
          forge coverage --ir-minimum --report summary | tee coverage-summary.txt

      # The floor gate is per production contract, not the `Total` row: the total is 66.5%
      # because `script/*.sol` are 0% by design (they are exercised by the demo and the
      # deployment assertion, not the unit suite). A single number on the total would have
      # to be set low enough to pass regardless, which is another way of saying it could
      # not fail. See scripts/coverage-gate.mjs for the floors and the targets behind them.
      - name: coverage floor gate
        run: node ../scripts/coverage-gate.mjs coverage-summary.txt

  # Static analysis. Findings are triaged by hand in docs/slither-triage.md -- this job
  # proves nothing NEW appeared, it does not decide what is acceptable.
  slither:
    name: Static analysis (slither)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # See the contracts job: a pinned tarball, because foundryup cannot run
      # beside the production anvil.
      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          mkdir -p "$FOUNDRY_DIR"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install slither-analyzer

      - name: slither
        # Fails on any detector not already excluded in slither.config.json. Every
        # suppression is justified in that file; adding one requires justifying it
        # there too, which is the entire point.
        run: slither .

  # Fork tests prove the ERC-8004 bridge works against the registry as actually
  # deployed, which a mock cannot. Separate from the default suite because it needs a
  # live RPC, and a gate that depends on a third party's uptime is not a gate.
  fork:
    name: Fork tests (ERC-8004 mainnet)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          # Each job gets its OWN foundry directory.
          #
          # The three jobs that need forge used to extract the tarball into
          # /tmp together, so they installed the same `forge` path at the same
          # time. Whichever was mid-write while another executed it failed with
          # "Text file busy" - a race between the jobs, not a defect in the
          # code, and it failed a different job each time, which is the worst
          # kind of failure to chase. RUNNER_TEMP is per-job, so the same
          # tarball lands somewhere private to each one.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          mkdir -p "$FOUNDRY_DIR"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      # The README keeps these out of the default gate on purpose: a gate that
      # depends on a third party's RPC is not a gate. But exiting 0 while running
      # nothing is how a skipped check reads as a passed one, and HARDENING.md's
      # open list already admits the bridge "has never been exercised against the
      # registry as actually deployed". So: say plainly, in the run's own output,
      # that this proves nothing, and let fork-nightly.yml be the job that does
      # run it on a schedule with the credential attached.
      - name: fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "::warning::FORK TESTS DID NOT RUN — no MAINNET_RPC_URL. This check is green because it was skipped, not because the ERC-8004 bridge works."
            {
              echo "## Fork tests: SKIPPED, not passed"
              echo ""
              echo "No \`MAINNET_RPC_URL\` is configured for this run, so the four ERC-8004 fork"
              echo "tests did not execute. A green tick here is not evidence that the bridge works"
              echo "against the registry as deployed. \`fork-nightly.yml\` runs them on a schedule"
              echo "and treats a missing credential as a failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          forge test --fork-url "$MAINNET_RPC_URL" --match-contract ForkTests -vv

  # Leaked credentials are the one class of defect that is already too late by the time
  # tests run. The whole history is scanned, not just the working tree; the only
  # suppressions are the deterministic Anvil keys and secp256k1 constants listed in
  # .gitleaks.toml, each with the reason it is not a secret.
  secrets:
    name: Secrets (gitleaks)
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install gitleaks (pinned tarball)
        run: |
          set -euo pipefail
          V="8.24.0"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v$V/gitleaks_${V}_linux_x64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      - name: scan history
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --log-opts="--all"

  # One job for every workspace, not a matrix per package: this repo runs on
  # two runners, and a ten-way matrix turns every push into a queue an hour
  # deep. The workspaces run in turn — same tests, one slot, a queue that drains
  # in minutes. All ten are named explicitly so a new workspace cannot be
  # silently skipped.
  node:
    name: TypeScript (all workspaces)
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `api` and `web` import the workspace packages through their package `exports`,
      # which point at `dist/` — and `dist/` is gitignored. Without this step a clean
      # checkout fails typecheck with "Cannot find module '@crucible/smith'", so the job
      # could only ever pass on a machine that had already built. `prepare` does this on
      # `npm install` locally; CI is explicit about it instead.
      - name: build workspace libraries
        run: npm run build:libs

      - name: typecheck (every workspace)
        run: |
          npm run typecheck \
            --workspace @crucible/smith \
            --workspace @crucible/forge-runner \
            --workspace @crucible/argus \
            --workspace @crucible/indexer \
            --workspace @crucible/warden \
            --workspace @crucible/agent-security \
            --workspace @crucible/cidstore \
            --workspace @crucible/keeper \
            --workspace @crucible/api \
            --workspace @crucible/web

      - name: test (every workspace)
        run: |
          npm test \
            --workspace @crucible/smith \
            --workspace @crucible/forge-runner \
            --workspace @crucible/argus \
            --workspace @crucible/indexer \
            --workspace @crucible/warden \
            --workspace @crucible/agent-security \
            --workspace @crucible/cidstore \
            --workspace @crucible/keeper \
            --workspace @crucible/api \
            --workspace @crucible/web

  build:
    name: Build (next)
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build --workspace @crucible/web

  audit:
    name: Dependency audit
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Known-unfixable, and documented as such in the README's "Known limits":
      # the postcss advisory covers every released Next version through
      # 16.3.0-preview, and the wallet stack (RainbowKit 2.2.11 pins wagmi ^2.9)
      # cannot be patched without dropping RainbowKit for wagmi 3.
      #
      # `|| true` stays, because npm audit legitimately exits non-zero when anything is
      # vulnerable — but the decision now belongs to scripts/audit-gate.mjs, which is a
      # file rather than an inline blob so it can be run and mutation-tested locally.
      # That gate refuses a payload it cannot reconcile (an absent schema, or an entry
      # count that disagrees with npm's own summary) instead of reading it as "no new
      # advisories", and it caps every documented name by severity, so a critical in a
      # wallet package is no longer excused by its prefix.
      - name: audit (documented set, with severity ceilings)
        run: |
          npm audit --json > audit.json || true
          node ../scripts/audit-gate.mjs audit.json