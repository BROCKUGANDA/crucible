name: ci

on:
  push:
    branches: [main, develop, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Foundry by pinned tarball, not foundryup: the runner box also hosts the
      # production anvil, and foundryup refuses to replace its binaries while
      # any foundry process is running. The tarball lands in /tmp and joins
      # PATH, so it never touches the host's ~/.foundry.
      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="/tmp:$PATH"
          forge --version

      - name: forge fmt --check
        run: forge fmt --check
        continue-on-error: true

      - name: build
        run: forge build --sizes

      - name: test
        run: forge test -vv

      - name: gas report
        run: forge test --gas-report | tee gas-report.txt

  # Static analysis. Findings are triaged by hand in docs/slither-triage.md -- this job
  # proves nothing NEW appeared, it does not decide what is acceptable.
  slither:
    name: Static analysis (slither)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # See the contracts job: a pinned tarball, because foundryup cannot run
      # beside the production anvil.
      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="/tmp:$PATH"
          forge --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install slither-analyzer

      - name: slither
        # Fails on any detector not already excluded in slither.config.json. Every
        # suppression is justified in that file; adding one requires justifying it
        # there too, which is the entire point.
        run: slither .

  # Fork tests prove the ERC-8004 bridge works against the registry as actually
  # deployed, which a mock cannot. Separate from the default suite because it needs a
  # live RPC, and a gate that depends on a third party's uptime is not a gate.
  fork:
    name: Fork tests (ERC-8004 mainnet)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install foundry (pinned tarball)
        run: |
          set -euo pipefail
          V="v1.8.5"
          curl -fsSL "https://github.com/foundry-rs/foundry/releases/download/$V/foundry_${V}_linux_amd64.tar.gz" \
            | tar xz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches *later* steps, so this step exports its own
          # or `forge --version` is the last thing it manages to do.
          export PATH="/tmp:$PATH"
          forge --version

      # The README keeps these out of the default gate on purpose: a gate that
      # depends on a third party's RPC is not a gate. The job therefore runs
      # and skips — `secrets` is not a named-value in a job-level `if`, and
      # reaching for one there fails the whole workflow at parse time.
      - name: fork tests
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: |
          if [ -z "${MAINNET_RPC_URL}" ]; then
            echo "MAINNET_RPC_URL is not configured — fork tests stay out of the default gate, as documented"
            exit 0
          fi
          forge test --fork-url "$MAINNET_RPC_URL" --match-contract ForkTests -vv

  node:
    name: TypeScript (${{ matrix.package }})
    runs-on: [self-hosted, linux, X64, crucible]
    strategy:
      fail-fast: false
      matrix:
        package: [smith, forge-runner, argus, indexer, warden, api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `api` and `web` import the workspace packages through their package `exports`,
      # which point at `dist/` — and `dist/` is gitignored. Without this step a clean
      # checkout fails typecheck with "Cannot find module '@crucible/smith'", so the job
      # could only ever pass on a machine that had already built. `prepare` does this on
      # `npm install` locally; CI is explicit about it instead.
      - name: build workspace libraries
        run: npm run build:libs

      - name: typecheck
        run: npm run typecheck --workspace @crucible/${{ matrix.package }}

      - name: test
        run: npm run test --workspace @crucible/${{ matrix.package }}

  build:
    name: Build (next)
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build --workspace @crucible/web

  audit:
    name: Dependency audit
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Known-unfixable, and documented as such in the README's "Known limits":
      # the postcss advisory covers every released Next version through
      # 16.3.0-preview, and the wallet stack (RainbowKit 2.2.11 pins wagmi ^2.9)
      # cannot be patched without dropping RainbowKit for wagmi 3. Fail only on
      # anything outside that documented set — the list is kept in step with the
      # README by hand, on purpose, so adding an advisory means editing a
      # sentence a reviewer can read.
      - name: audit (ignoring the documented wallet-stack set)
        run: |
          npm audit --json > audit.json || true
          node -e "
            const a = require('./audit.json');
            const families = [
              '@walletconnect/', '@metamask/', '@reown/', '@rainbow-me/',
              '@wagmi/', '@base-org/', '@gemini-wallet/',
            ];
            const exact = new Set([
              'postcss', 'next', 'decode-uri-component', 'query-string',
              'uuid', 'viem', 'wagmi', 'ws',
            ]);
            const vulns = a.vulnerabilities || {};
            const known = (name) =>
              exact.has(name) || families.some((f) => name.startsWith(f));
            const bad = Object.entries(vulns)
              .filter(([name]) => !known(name))
              .map(([name, v]) => name + '@' + v.severity);
            if (bad.length) {
              console.error('advisories outside the documented set: ' + bad.join(', '));
              process.exit(1);
            }
            console.log('only advisories the README documents are present');
          "