name: ci

on:
  push:
    branches: [main, develop, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (forge)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: forge fmt --check
        run: forge fmt --check
        continue-on-error: true

      - name: build
        run: forge build --sizes

      - name: test
        run: forge test -vv

      - name: gas report
        run: forge test --gas-report | tee gas-report.txt

  # Static analysis. Findings are triaged by hand in docs/slither-triage.md -- this job
  # proves nothing NEW appeared, it does not decide what is acceptable.
  slither:
    name: Static analysis (slither)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install slither-analyzer

      - name: slither
        # Fails on any detector not already excluded in slither.config.json. Every
        # suppression is justified in that file; adding one requires justifying it
        # there too, which is the entire point.
        run: slither .

  # Fork tests prove the ERC-8004 bridge works against the registry as actually
  # deployed, which a mock cannot. Separate from the default suite because it needs a
  # live RPC, and a gate that depends on a third party's uptime is not a gate.
  fork:
    name: Fork tests (ERC-8004 mainnet)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: fork tests
        run: forge test --fork-url ${{ secrets.MAINNET_RPC_URL }} --match-contract ForkTests -vv

  node:
    name: TypeScript (${{ matrix.package }})
    runs-on: [self-hosted, linux, X64, crucible]
    strategy:
      fail-fast: false
      matrix:
        package: [smith, forge-runner, argus, indexer, warden, api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `api` and `web` import the workspace packages through their package `exports`,
      # which point at `dist/` — and `dist/` is gitignored. Without this step a clean
      # checkout fails typecheck with "Cannot find module '@crucible/smith'", so the job
      # could only ever pass on a machine that had already built. `prepare` does this on
      # `npm install` locally; CI is explicit about it instead.
      - name: build workspace libraries
        run: npm run build:libs

      - name: typecheck
        run: npm run typecheck --workspace @crucible/${{ matrix.package }}

      - name: test
        run: npm run test --workspace @crucible/${{ matrix.package }}

  build:
    name: Build (next)
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:libs
      - run: npm run build --workspace @crucible/web

  audit:
    name: Dependency audit
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Known-unfixable: the postcss advisory covers every released Next version
      # through 16.3.0-preview. Fail only on anything not on that list.
      - name: audit (ignoring known-unfixable next/postcss)
        run: |
          npm audit --json > audit.json || true
          node -e "
            const a = require('./audit.json');
            const known = new Set(['postcss']);
            const vulns = a.vulnerabilities || {};
            const bad = Object.entries(vulns)
              .filter(([name, v]) => !known.has(name))
              .map(([name, v]) => name + '@' + v.severity);
            if (bad.length) {
              console.error('unacknowledged advisories: ' + bad.join(', '));
              process.exit(1);
            }
            console.log('only known-unfixable advisories present');
          "