name: deploy

# Ships `main` to the VPS. The runner IS the VPS (crucible-vps-1/2 run on
# 57.130.80.158), so there is no SSH key to rotate: the build and the swap
# happen on the machine that serves the site.
#
# The two rules that keep the deployment boring, both learned the hard way:
#
#   1. **The server's .env is never overwritten.** It holds the production
#      build args (NEXT_PUBLIC_API_URL and friends) that get baked into the
#      browser bundle, and a tarball that carried a developer's .env once
#      pointed the whole site at localhost. It is excluded from the sync.
#   2. **anvil is never restarted.** The chain holds the live trials the site
#      narrates; only web, api and keeper are swapped, with --no-deps, so the RPC
#      container keeps its state across every deploy. The keeper is in that list
#      because it holds nothing a restart loses: it re-derives the due-set and
#      skips trials already settled.

on:
  # The deploy rides the gate, not the push.
  #
  # `main` is reached by the promotion job, and that job pushes with
  # GITHUB_TOKEN — which does not raise a `push` event. A deploy that waited
  # for the push therefore never ran, and the site kept serving whatever was
  # last built. The gate's completion is the honest moment to ship: ci on
  # `main` has already finished, and its conclusion is right there.
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "what the matching release tag bumps"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          ref: main

      # Nothing ships on a red gate.
      - name: refuse a red gate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "ci concluded '${{ github.event.workflow_run.conclusion }}' on main; deploy refused"
          exit 1

      # The API entrypoint must stay executable: a tar round-trip once stripped
      # the bit and the API container refused to start for two minutes.
      - name: keep the entrypoint executable
        run: chmod +x apps/api/docker-entrypoint.sh

      - name: sync the tree to ~/crucible
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude 'out' \
            --exclude '.git' \
            --exclude 'docs/media/raw' \
            --exclude 'docs/media/cards' \
            --exclude '*.log' \
            "$GITHUB_WORKSPACE/" "$HOME/crucible/"

          # A checkout on Windows can hand rsync a 0644 mode for the container
          # entrypoints, and a 0644 ENTRYPOINT is a container that refuses to
          # start. Git carries the +x bit; this makes the sync honour it even
          # when the checkout did not.
          chmod +x apps/api/docker-entrypoint.sh apps/keeper/docker-entrypoint.sh crucible-contracts/docker-seed.sh

      # Build hygiene: this box once filled to 100% and the runner's checkout
      # failed with ENOSPC. Reclaim the builder cache before asking Docker for
      # more; the running stacks keep their images either way.
      - name: reclaim builder cache before building
        run: |
          set -euo pipefail
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true
          df -h / | tail -1

      # Build before the swap: a failed compile leaves the running stack up.
      # Keep the edge attached to this stack.
      #
      # The site is served by a shared reverse proxy that another project on the
      # same box owns. It reaches this stack by service name, which only works
      # from inside this stack's compose network — and that attachment is made
      # by hand, because it belongs to a compose file this project does not
      # have. A recreate of the proxy drops it, and every request for this
      # site then answers 502 while every container here reports itself
      # healthy: the failure looks like an outage here and has nothing to do
      # with it. It happened on 2026-10-21.
      #
      # So the deploy repairs the attachment before it does anything else. The
      # step is idempotent and reads only Docker's own state.
      - name: keep the edge attached to this stack
        run: |
          set -uo pipefail
          cd "$HOME/crucible"

          NET=$(docker network ls --format '{{.Name}}' | grep -E '^crucible_default$' | head -n 1)
          if [ -z "$NET" ]; then
            echo "::error::the crucible network is missing; run a full 'docker compose up' to recreate it"
            exit 1
          fi

          attached=0
          for c in $(docker ps --format '{{.Names}}' | grep -iE 'caddy' || true); do
            if docker inspect -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c" | grep -q "$NET"; then
              echo "$c is on $NET"
            else
              echo "attaching $c to $NET"
              docker network connect "$NET" "$c" || true
            fi
            attached=1
          done
          if [ "$attached" = "0" ]; then
            echo "::warning::no edge container found on this host; the site may be served from elsewhere"
          fi

          # The repair belongs on a host timer, not on this pipeline.
          #
          # The attachment is dropped by a deploy of a DIFFERENT project, so
          # nothing about this one happens at that moment, and a watchdog that
          # depends on the thing it watches cannot report that the thing is
          # broken. A cron entry on the box has neither dependency.
          if [ -f deploy/edge-attach.sh ]; then
            sudo install -m 0755 deploy/edge-attach.sh /usr/local/bin/crucible-edge-attach
            ( crontab -l 2>/dev/null | grep -v 'crucible-edge-attach' ; \
              echo '*/2 * * * * /usr/local/bin/crucible-edge-attach >> /home/ubuntu/crucible-edge-attach.log 2>&1' \
            ) | crontab -
            echo "host timer installed"
          fi

      - name: make sure the host configuration names this deployment
        run: |
          set -euo pipefail
          cd "$HOME/crucible"
          if [ ! -f .env ]; then
            echo "::error::no .env on the host; the API has no addresses to read"
            exit 1
          fi
          # These three are DERIVABLE, so a deployment that forgot them gets
          # them filled in rather than running on a default. The secret is not
          # among them: a deployment that was not given one must get a 503 from
          # the auth routes, not a session signed with a fallback.
          set_if() {
            key="$1"; value="$2"
            if grep -qE "^${key}=" .env; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }
          set_if AUTH_ORIGIN "https://crucible.svalley.tech"
          set_if CHAIN_ID "31337"
          # The proxy in front overwrites X-Real-IP, so the limiter can key on
          # the real client instead of on the proxy's address — with it off,
          # every visitor in the world shares one bucket.
          set_if TRUST_PROXY "1"
          echo "=== the sign-in and proxy keys, values redacted ==="
          sed -E 's/=.*/=<redacted>/' .env | grep -E "^(AUTH_ORIGIN|AUTH_SECRET|AUTH_ALLOW_DEV_SECRET|CHAIN_ID|TRUST_PROXY)=" || true

      # The keeper refuses to start without a signing key. `compose.yaml` passes
      # `PRIVATE_KEY: ${KEEPER_PRIVATE_KEY:-}`, `apps/keeper/src/main.ts` calls
      # `required("TRIALS_ADDRESS")`/`resolveKeeperAccount` at boot, and viem rejects anything
      # that is not a 32-byte hex key — so recreating the keeper on a host whose .env has no
      # key replaces a running service with a crash loop, and nothing sweeps until someone
      # reads the logs. Refuse before the build, with the existing keeper still running.
      #
      # The value is never printed. The shape is checked because a typo fails the same way
      # a missing key does, and `privateKeyToAccount` is the only consumer that would say so.
      - name: refuse to swap the keeper onto a host with no signing key
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          if [ ! -f .env ]; then
            echo "::error::no .env on the host; the keeper has no signing key to read"
            exit 1
          fi
          key="$(grep -E '^KEEPER_PRIVATE_KEY=' .env | tail -n 1 | cut -d= -f2- \
            | tr -d '[:space:]' || true)"
          if [ -z "$key" ]; then
            echo "::error::KEEPER_PRIVATE_KEY is empty in .env; leaving the running keeper in place"
            exit 1
          fi
          if ! printf '%s' "$key" | grep -Eq '^0x[0-9a-fA-F]{64}$'; then
            echo "::error::KEEPER_PRIVATE_KEY is not a 0x-prefixed 32-byte hex key; leaving the running keeper in place"
            exit 1
          fi
          echo "KEEPER_PRIVATE_KEY is set and shaped like a key (value not printed)"

      # Blue-green's useful half on a single box is not a second live slot — it is being able to put
      # the previous build back. Compose builds overwrite `:latest` in place, so without this tag the
      # build that was serving becomes an untagged dangling layer and the only recovery is rebuilding
      # a tree that no longer exists. Measured on the box: the 2026-10-24 incident was rolled back by
      # hand with exactly these tags — `crucible-web:rollback-20261024c` was still there 26 hours
      # later — so this makes a step of what is already the practice.
      - name: tag the images this deploy replaces
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          stamp="rollback-${GITHUB_RUN_ID}"
          for s in web api keeper; do
            if docker image inspect "crucible-$s:latest" >/dev/null 2>&1; then
              docker tag "crucible-$s:latest" "crucible-$s:$stamp"
              echo "kept crucible-$s:latest as crucible-$s:$stamp"
            else
              # Not a failure: on a first deploy there is nothing to go back to, and saying so is
              # better than a rollback step that quietly restores nothing.
              echo "no crucible-$s:latest exists — this run cannot roll that service back"
            fi
          done

      - name: build web, api and keeper
        working-directory: /home/ubuntu/crucible
        # The seed image is built too — and only BUILT, never run. The deploy
        # swaps `web`, `api` and `keeper` with `--no-deps` so anvil keeps its chain, and
        # the seed service is left alone for the same reason. But the
        # post-deploy assertions run inside the seed image, and an image built
        # before the assertion script existed does not contain it — so the
        # deploy failed on a file that was in the repository and not in the
        # image. Building is not running.
        #
        # The keeper joins the build because it joined the swap. Measured on
        # 2026-10-23: `crucible-keeper-1` was Up 2 weeks while web and api were Up 4
        # minutes, and inside it `env | grep -ci trace` was 0 with no mounts — the
        # daemon moving money on the demo box was the hackathon build, two weeks of
        # its own hardening short (trace spine, gas ledger, sweep kill switch,
        # acting-hop breaker). A service the deploy never recreates ages silently.
        run: docker compose -f compose.yaml -f compose.vps.yaml build web api keeper seed

      # Validate the addresses BEFORE the swap, not after it.
      #
      # The seed publishes what actually landed to `/run/crucible/deployed.env` on the
      # `deployed` volume, and the API's entrypoint sources it. `.env` carries the same pair
      # for the web bundle and the keeper. A deploy that swapped first and asserted second
      # would take a working site down to learn that `.env` named a contract the chain does
      # not have — the old containers are gone by then, and the failure surfaces minutes later
      # in the health probe. A missing or stale address is a refusal here, while the running
      # stack is still intact.
      #
      # Reading the file needs no running service: a one-off seed container mounts the volume,
      # so this also works on a box whose api has already fallen over.
      - name: refuse to swap onto addresses the seed did not publish
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          # `|| true` so a missing key produces the message below rather than an exit under
          # pipefail with no explanation.
          from_env() {
            { grep -E "^$1=" .env || true; } | tail -n 1 | cut -d= -f2- | tr -d '[:space:]' | tr 'A-Z' 'a-z'
          }
          trials="$(from_env TRIALS_ADDRESS)"
          alloy="$(from_env ALLOY_ADDRESS)"
          if [ -z "$trials" ] || [ -z "$alloy" ]; then
            echo "::error::.env names no contract addresses; refusing to swap"
            exit 1
          fi

          published="$(docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps -T \
            --entrypoint cat seed /run/crucible/deployed.env)"
          from_published() {
            { printf '%s\n' "$published" | grep -E "^$1=" || true; } | tail -n 1 | cut -d= -f2- \
              | tr -d '[:space:]' | tr 'A-Z' 'a-z'
          }
          published_trials="$(from_published TRIALS_ADDRESS)"
          published_alloy="$(from_published ALLOY_ADDRESS)"
          if [ -z "$published_trials" ] || [ -z "$published_alloy" ]; then
            echo "::error::the seed volume carries no published addresses; bring the stack up once"
            exit 1
          fi
          if [ "$trials" != "$published_trials" ] || [ "$alloy" != "$published_alloy" ]; then
            echo "::error::.env names $trials / $alloy; the seed published $published_trials / $published_alloy"
            exit 1
          fi
          echo "the host configuration names the contracts the seed published"

      # The promise a visitor makes when they refresh the page mid-trial, and the one an operator
      # makes when they ship a build: deploying cannot move money or rewrite a contract. The design
      # already holds it — anvil is never restarted, the seed service is built and never run, and
      # settlement credits a pull ledger before any ETH moves (ADR-0003). A design that is not
      # measured is a hope, so record the two facts the swap must not change and re-read them after
      # the probes: the node's own start time, and the bytecode at the escrow address. The exact
      # money equality is asserted on the live chain by `scripts/assert-deployment.sh` below.
      - name: record the chain this deploy must not touch
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          trials=$(grep -E '^TRIALS_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$trials" ]; then
            echo "::error::no TRIALS_ADDRESS in .env, so there is no escrow to fence"
            exit 1
          fi
          anvil_id=$(docker compose -f compose.yaml -f compose.vps.yaml ps -q anvil)
          if [ -z "$anvil_id" ]; then
            echo "::error::anvil is not a container in this project — nothing would stop a redeploy"
            exit 1
          fi
          anvil_started=$(docker inspect --format '{{.State.StartedAt}}' "$anvil_id")
          escrow_code=$(docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps \
            --entrypoint sh -e RPC_URL=http://anvil:8545 -e T="$trials" seed -c \
            'cast code "$T" --rpc-url "$RPC_URL" | sha256sum | cut -d" " -f1')
          printf 'anvil_started=%s\nescrow_code=%s\n' "$anvil_started" "$escrow_code" \
            > /tmp/crucible-deploy-fence
          echo "fence set — anvil up since $anvil_started, escrow code $escrow_code"

      - name: swap web, api and keeper (anvil keeps its chain)
        working-directory: /home/ubuntu/crucible
        # `--no-deps` is the part that protects anvil, and it stays. The keeper is
        # different from anvil and seed: it holds no state a restart loses. It reads
        # the head, derives what is due, and calls `finalize`/`reclaimExpired` —
        # both permissionless, both reverting when the trial is already settled
        # (CrucibleTrials.sol:671), which is the idempotency guarantee. A recreated
        # keeper re-derives the same due-set and skips what it already finished, so
        # nothing credits twice; settlement credits the pull ledger before any ETH
        # moves (ADR-0003), so a mid-swap death leaves a credit, not a loss.
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f compose.vps.yaml up -d --no-deps web api keeper
          # The rollback step below must know whether the swap actually happened. Most of this job's
          # refusals fire before it — a red gate, an address the seed never published, a keeper with
          # no signing key — and re-pointing `:latest` plus recreating three healthy containers after
          # one of those would take a working site down to undo a change that was never made.
          touch /tmp/crucible-swapped

      # A recreate is not a swap. The keeper's healthcheck is declared in compose.yaml
      # (`wget /health`, 10s interval, 30 retries); this polls Docker's view of it with its
      # own bound, so a keeper that never becomes healthy fails the deployment here instead
      # of being discovered later by a settlement that never happened. It stays separate from
      # the public probes below: those answer for the site, not for the daemon.
      - name: wait for the keeper that was just started to become healthy
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          id=""
          for _ in $(seq 1 10); do
            id="$(docker compose -f compose.yaml -f compose.vps.yaml ps -a -q keeper)"
            [ -n "$id" ] && break
            sleep 1
          done
          if [ -z "$id" ]; then
            echo "::error::the keeper container is not there after the swap"
            exit 1
          fi
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            state="$(docker inspect -f '{{.State.Status}}|{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$id" 2>/dev/null || echo gone)"
            case "$state" in
              running\|healthy)
                echo "the keeper is healthy"
                exit 0
                ;;
              running\|starting)
                ;;
              running\|none)
                echo "::error::the keeper is running with no healthcheck; compose.yaml and the image disagree"
                exit 1
                ;;
              running\|unhealthy)
                echo "::error::the keeper reported unhealthy"
                docker inspect -f '{{range .State.Health.Log}}{{.ExitCode}}: {{.Output}}{{"\n"}}{{end}}' "$id" 2>/dev/null | tail -20 || true
                exit 1
                ;;
              gone)
                echo "::error::the keeper container disappeared during the swap"
                exit 1
                ;;
              *)
                echo "::error::the keeper is not running after the swap ($state) — it refused to start"
                docker logs --tail 40 "$id" 2>&1 || true
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::the keeper did not become healthy within 180s (last: $state)"
          exit 1

      - name: prove it serves
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://crucible.svalley.tech/api/health || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "health check failed: $CODE"; exit 1; }
          curl -sk -o /dev/null -w 'home %{http_code}\n' https://crucible.svalley.tech/
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD | xargs echo "serving commit:"

      # A deploy that answers 200 is not the same as a deploy that is correct.
      #
      # The assertions read the chain that is actually live — the fee, the bond
      # rule, the committee's threshold, the roles, and the money invariant
      # (the ETH the contract holds against everything it owes) — and they read
      # the public surface to catch the failure a health check cannot see: the
      # web bundle bakes its contract address at build time, so a rebuilt chain
      # leaves the site pointing at a contract that is not there.
      #
      # It runs inside the seed image because that is where foundry lives, and
      # it runs ON the compose network because that is where anvil is.
      - name: assert the deployment
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          trials=$(grep -E '^TRIALS_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          alloy=$(grep -E '^ALLOY_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$trials" ] || [ -z "$alloy" ]; then
            echo "::error::no contract addresses in .env"
            exit 1
          fi
          docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps \
            --entrypoint sh \
            -e RPC_URL=http://anvil:8545 \
            -e TRIALS_ADDRESS="$trials" \
            -e ALLOY_ADDRESS="$alloy" \
            -e PUBLIC_URL=https://crucible.svalley.tech \
            seed scripts/assert-deployment.sh

      # The public surface, probed from the HOST.
      #
      # These run here rather than inside the seed container because the
      # container is on the compose network, where the public name does not
      # resolve the way a visitor's does: the probe was measuring the
      # container's network instead of the site's, and answered 0 for a site
      # that was answering 200.
      #
      # The chain can be perfectly correct while the site points somewhere
      # else — the web bundle bakes its contract address in at build time, and
      # the API reads its own. If those two ever disagree, a judge connects a
      # wallet and talks to a contract that is not the one the site is showing.
      - name: assert the public surface
        run: |
          set -euo pipefail
          cd "$HOME/crucible"
          trials=$(grep -E '^TRIALS_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]' | tr 'A-Z' 'a-z')
          fail=0
          for probe in \
            "site=https://crucible.svalley.tech/" \
            "ready=https://crucible.svalley.tech/api/ready" \
            "health=https://crucible.svalley.tech/api/health"; do
            name="${probe%%=*}"
            url="${probe#*=}"
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            if [ "$code" = "200" ]; then
              echo "  ok    $name answers 200"
            else
              echo "  FAIL  $name answered $code"
              fail=1
            fi
          done

          reported=$(curl -sk --max-time 20 https://crucible.svalley.tech/api/hall 2>/dev/null \
            | sed -n 's/.*"trialsAddress":"\([^"]*\)".*/\1/p' | tr 'A-Z' 'a-z')
          if [ -n "$reported" ] && [ "$reported" = "$trials" ]; then
            echo "  ok    the API is serving the contract that was deployed"
          else
            echo "  FAIL  the API reports ${reported:-nothing}; the deployment says $trials"
            fail=1
          fi

          sync_error=$(curl -sk --max-time 20 https://crucible.svalley.tech/api/health 2>/dev/null \
            | sed -n 's/.*"syncError":\([^,}]*\).*/\1/p')
          if [ "$sync_error" = "null" ] || [ -z "$sync_error" ]; then
            echo "  ok    the indexer reports no sync error"
          else
            echo "  FAIL  the indexer reports a sync error: $sync_error"
            fail=1
          fi

          if [ "$fail" != "0" ]; then
            echo "::error::the public surface is not what the deployment claims"
            exit 1
          fi
          echo "the public surface is serving the deployment that was just asserted"

      # The other half of the fence. Both comparisons are things a deploy must never change:
      # a restarted anvil means the chain a visitor was reading is gone, and a changed bytecode at
      # the escrow address means ETH was left on a contract that got replaced under it. Balance is
      # deliberately NOT asserted equal across the window — the keeper is expected to settle due
      # trials during a deploy, and that movement is real work, accounted for by the conservation
      # equality `assert-deployment.sh` checks on the live chain.
      - name: prove the deploy touched no chain state
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          # Missing file is an error under `set -u`, which is the wanted behaviour: a deploy that
          # never set the fence must not be able to pass the check that reads it.
          . /tmp/crucible-deploy-fence
          trials=$(grep -E '^TRIALS_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          now_started=$(docker inspect --format '{{.State.StartedAt}}' \
            "$(docker compose -f compose.yaml -f compose.vps.yaml ps -q anvil)")
          now_code=$(docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps \
            --entrypoint sh -e RPC_URL=http://anvil:8545 -e T="$trials" seed -c \
            'cast code "$T" --rpc-url "$RPC_URL" | sha256sum | cut -d" " -f1')
          fail=0
          if [ "$now_started" != "$anvil_started" ]; then
            echo "::error::anvil restarted during the deploy ($anvil_started -> $now_started); the chain visitors were reading is gone"
            fail=1
          fi
          if [ "$now_code" != "$escrow_code" ]; then
            echo "::error::the escrow's bytecode changed during the deploy ($escrow_code -> $now_code); money was left on a replaced contract"
            fail=1
          fi
          if [ "$fail" != "0" ]; then
            exit 1
          fi
          echo "same node, same bytecode — the deploy swapped three services and left the chain alone"

      # The other half of the tag step above, and the reason the tag happens before the build.
      #
      # `if: failure()` means this runs when something above has already gone red — which is exactly
      # when the box may be serving a build that failed its own probes. Before this existed, a deploy
      # that swapped and then failed its assertions left the broken build serving and only reported
      # the fact; the 2026-10-24 incident was recovered by hand, on the box, by someone remembering
      # that the old images could be re-tagged.
      #
      # It deliberately does not make the job green. A rolled-back deploy is still a failed deploy:
      # `release.yml` is never asked for, the run stays red, and the annotation says which build is
      # now live. A rollback that laundered a bad build into a green check would be worse than none.
      - name: roll the swap back if the deploy failed after it
        if: failure()
        working-directory: /home/ubuntu/crucible
        run: |
          set -euo pipefail
          if [ ! -e /tmp/crucible-swapped ]; then
            echo "the swap never happened — the running stack is untouched and there is nothing to roll back"
            exit 0
          fi
          stamp="rollback-${GITHUB_RUN_ID}"
          restored=""
          for s in web api keeper; do
            if docker image inspect "crucible-$s:$stamp" >/dev/null 2>&1; then
              docker tag "crucible-$s:$stamp" "crucible-$s:latest"
              restored="$restored $s"
            else
              echo "no $stamp image for $s — that service stays on whatever the failed run put there"
            fi
          done
          if [ -z "$restored" ]; then
            echo "::error::the swap happened and no rollback images exist; the box is on the failed build"
            exit 1
          fi
          # Word-splitting is intended: `restored` names the services that have a previous image.
          # shellcheck disable=SC2086
          docker compose -f compose.yaml -f compose.vps.yaml up -d --no-deps $restored
          back=""
          for _ in $(seq 1 12); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 https://crucible.svalley.tech/ || echo 000)
            ready=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 20 https://crucible.svalley.tech/api/ready || echo 000)
            if [ "$code" = "200" ] && [ "$ready" = "200" ]; then back=1; break; fi
            sleep 5
          done
          if [ -z "$back" ]; then
            echo "::error::the rollback did not restore a serving site (site=$code ready=$ready); intervene on the box"
            exit 1
          fi
          echo "rolled back to:$restored — the previous build is serving again, and the deploy is still red"

      # The rung below this one, asked for by name.
      #
      # `release.yml` used to listen for this workflow's completion and never heard it: the
      # promotion starts `deploy` with `workflow_dispatch` (a push made with GITHUB_TOKEN raises
      # no event), and a dispatched run raises no downstream `workflow_run` either. Measured on
      # 2026-10-25 — the chained deploys of 2026-10-24 each created a release run that correctly
      # skipped for a red gate, while the deploy that actually shipped the site created none, and
      # the first tag was asked for by hand. Same rule the promotion already had to learn, one
      # rung further down.
      #
      # Waiting instead of firing and forgetting is what makes "every deploy tags its own release"
      # a fact rather than a hope: a deploy that stops at a probe never reaches this step, and a
      # deploy that reaches it goes red if the tag fails, so main cannot serve an untagged build
      # quietly. The token needs `actions: write`, which comes from the repository's Actions
      # setting for the same reason promote.yml spells it out — it cannot be requested in-file.
      - name: ask for the release and wait for it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          # The dispatch endpoint answers with no run id, so record the newest run of this kind
          # first and wait for a greater one; otherwise this watches the previous release and
          # calls a tag that never happened a success.
          before=$(gh run list \
            --workflow release.yml \
            --branch main \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)

          # gh exits non-zero when the API refuses the dispatch, so a release that was never asked
          # for is a red run here rather than a missing tag noticed a week later.
          gh workflow run release.yml --ref main -f bump="$BUMP"

          run_id=""
          for _ in $(seq 1 20); do
            run_id=$(gh run list \
              --workflow release.yml \
              --branch main \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId' 2>/dev/null | sort -nr | while read -r id; do
                if [ "$id" -gt "$before" ]; then echo "$id"; break; fi
              done || true)
            if [ -n "$run_id" ]; then break; fi
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "::error::could not find the release run this deploy asked for"
            exit 1
          fi

          echo "watching release run $run_id"
          if ! gh run watch "$run_id" --exit-status --interval 10; then
            echo "::error::the site shipped and the release did not; main is serving without a tag"
            exit 1
          fi
          echo "the deploy that shipped the site also tagged it"

