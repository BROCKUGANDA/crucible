name: deploy

# Ships `main` to the VPS. The runner IS the VPS (crucible-vps-1/2 run on
# 57.130.80.158), so there is no SSH key to rotate: the build and the swap
# happen on the machine that serves the site.
#
# The three rules that keep the deployment boring, all learned the hard way:
#
#   1. **The server's .env is never overwritten.** It holds the production
#      build args (NEXT_PUBLIC_API_URL and friends) that get baked into the
#      browser bundle, and a tarball that carried a developer's .env once
#      pointed the whole site at localhost. It is excluded from the sync.
#   2. **anvil is never restarted.** The chain holds the live trials the site
#      narrates; only web and api are swapped, with --no-deps, so the RPC
#      container keeps its state across every deploy.
#   3. **An unproven commit is never shipped.** The trigger is `workflow_run`,
#      not `push`: a push to main used to start a deploy in parallel with `ci`,
#      so a red build could still roll forward (six did on 2026-10-09). The
#      gate is ci's completion event, and `promote.yml` states the invariant
#      plainly — nothing promotes on a red gate.

on:
  workflow_run:
    workflows: ["ci"]
    branches: [main]
    types: [completed]
  # Manual re-run, for when the machine was down during an automatic deploy.
  workflow_dispatch:

# Reading workflow runs to prove main is green on the manual path needs
# `actions: read`; nothing in this workflow writes.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ship:
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      # The gate. A failed `ci` must never deploy, however this run was
      # triggered, and `workflow_dispatch` has no upstream run to inspect — so
      # the manual path proves main is green by asking GitHub.
      - name: refuse an unproven commit
        env:
          EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual deploy: verifying ci on main is currently green"
            code=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=1" \
              --jq '.workflow_runs[0].conclusion')
            [ "$code" = "success" ] || {
              echo "::error::ci on main is not green (got '${code:-none}') — refusing a manual deploy."
              exit 1
            }
            echo "ci on main: $code"
            exit 0
          fi

          if [ "$RUN_CONCLUSION" != "success" ]; then
            echo "::error::ci run ${RUN_ID} concluded '${RUN_CONCLUSION}'. Production only deploys what ci proved green."
            exit 1
          fi
          echo "ci run ${RUN_CONCLUSION}: ${RUN_ID}"

      - uses: actions/checkout@v4
        with:
          # Ship the exact commit `ci` proved, not whatever landed on main while it ran;
          # a newer commit gets its own gate on its own run.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      # The API entrypoint must stay executable: a tar round-trip once stripped
      # the bit and the API container refused to start for two minutes.
      - name: keep the entrypoint executable
        run: chmod +x apps/api/docker-entrypoint.sh

      - name: sync the tree to ~/crucible
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude 'out' \
            --exclude '.git' \
            --exclude 'docs/media/raw' \
            --exclude 'docs/media/cards' \
            --exclude '*.log' \
            "$GITHUB_WORKSPACE/" "$HOME/crucible/"

          # A checkout on Windows can hand rsync a 0644 mode for the container
          # entrypoints, and a 0644 ENTRYPOINT is a container that refuses to
          # start. Git carries the +x bit; this makes the sync honour it even
          # when the checkout did not.
          chmod +x apps/api/docker-entrypoint.sh crucible-contracts/docker-seed.sh

      # Build hygiene: this box once filled to 100% and the runner's checkout
      # failed with ENOSPC. Reclaim the builder cache before asking Docker for
      # more; the running stacks keep their images either way.
      - name: reclaim builder cache before building
        run: |
          set -euo pipefail
          docker builder prune -af >/dev/null 2>&1 || true
          docker image prune -f >/dev/null 2>&1 || true
          df -h / | tail -1

      # Build before the swap: a failed compile leaves the running stack up.
      - name: build web and api
        working-directory: /home/ubuntu/crucible
        run: docker compose -f compose.yaml -f compose.vps.yaml build web api

      - name: swap web and api (anvil keeps its chain)
        working-directory: /home/ubuntu/crucible
        run: docker compose -f compose.yaml -f compose.vps.yaml up -d --no-deps web api

      - name: prove it serves
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            CODE=$(curl -sk -o /dev/null -w '%{http_code}' https://crucible.svalley.tech/api/health || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          [ "$CODE" = "200" ] || { echo "health check failed: $CODE"; exit 1; }
          curl -sk -o /dev/null -w 'home %{http_code}\n' https://crucible.svalley.tech/
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD | xargs echo "serving commit:"
