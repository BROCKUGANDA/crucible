name: promote

# The promotion ladder. A green build on `develop` becomes `staging`; a green
# build on `staging` becomes `main`; a change that reaches `main` ships through
# deploy.yml. Nothing promotes on a red gate, and the ladder only ever moves
# forward — it is a merge, never a rewrite, so the history says where each
# release came from.
#
# The trigger is `workflow_run`, not `push`: waiting on the *check suites of the
# pushed commit* deadlocks, because the gate's own suite is one of the pending
# suites it is waiting for. The completion event is also the honest moment to
# ask — ci.yml has already finished, and its conclusion is right there.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [develop, staging]
  workflow_dispatch:
    inputs:
      from:
        description: "branch to promote (develop or staging)"
        required: true
        default: develop

concurrency:
  group: promote-${{ github.event.workflow_run.head_branch || inputs.from }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, linux, X64, crucible]
    # The merge pushes to the repo, so the job's token needs contents:write.
    # Declared here rather than inherited from the repository default: a
    # setting a reviewer cannot see in the diff is a setting the next repo
    # will not have.
    #
    # `actions: write` is the other half, and its absence was silent: the job
    # asked for the next gate with a token that could not, the API answered
    # 403, and the step printed the code and exited 0. The ladder then sat
    # waiting for a gate that was never going to run, and nothing said so.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.from }}

      - name: refuse a red gate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "ci concluded '${{ github.event.workflow_run.conclusion }}' on ${{ github.event.workflow_run.head_branch }}; promotion refused"
          exit 1

      - name: merge forward
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FROM=${{ github.event.workflow_run.head_branch || inputs.from }}
          TARGET=$([ "$FROM" = "develop" ] && echo "staging" || echo "main")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin "$FROM" "$TARGET"
          # The commit being promoted is the head of the branch it is promoted
          # from — read from origin, because a workflow_run's head_sha is the
          # ci run's checkout, which is the same commit but not always the same
          # ref a hand-dispatch starts from.
          SHA=$(git rev-parse "origin/$FROM")

          echo "promoting $FROM ($SHA) -> $TARGET"

          git switch -C "$TARGET" "origin/$TARGET"

          # Nothing to promote is a normal state, not a failure — and it must
          # not dispatch a gate. The gate would complete, which would raise
          # this workflow again, which would dispatch the gate again. The
          # ladder would run forever on a chain that is already current.
          if git merge-base --is-ancestor "$SHA" "origin/$TARGET"; then
            echo "already promoted: $SHA is in $TARGET, nothing to do"
            exit 0
          fi

          # A conflict must not be able to wedge the ladder.
          #
          # `staging` and `main` are write-only: nothing edits them except this
          # job, so their content is always a snapshot of some `develop` state
          # and never contains intent that `develop` lacks. When the two
          # branches touch the same lines — the same change committed
          # independently on both, which is how this happened once — the
          # promotion source is the one carrying the newer intent, so the
          # conflicting hunks are taken from it. Everything that is not in
          # conflict is still merged from both sides.
          #
          # Without this, one conflicting line on `staging` refused every
          # promotion for eight days and production kept serving an old build,
          # because the only way forward was a human noticing a red pipeline.
          if ! git merge --no-ff "$SHA" -m "chore(promote): $FROM -> $TARGET"; then
            echo "::warning::merge conflicted; resolving in favour of $FROM (the promotion source)"
            git merge --abort
            git merge --no-ff -X theirs "$SHA" \
              -m "chore(promote): $FROM -> $TARGET (conflicts resolved in favour of $FROM)"
          fi

          git push origin "$TARGET"
          echo "promoted $FROM to $TARGET"

      # The next rung of the ladder, asked for explicitly.
      #
      # A push made with GITHUB_TOKEN does not raise a `push` event — GitHub
      # suppresses it so a workflow cannot make itself loop. That suppression
      # is why the ladder used to stop one rung short: the promotion wrote
      # `staging`, nothing noticed, and no gate ever ran on it, so the
      # promotion to `main` was never reached. The ladder's own history
      # records the full run happening anyway, because the branches were
      # pushed by hand rather than by this workflow.
      #
      # `workflow_dispatch` is the documented exception to the suppression, so
      # the promotion asks for the next gate by name. The gate then runs on
      # the ref that was asked for, and its completion raises the `workflow_run`
      # this workflow listens to.
      - name: ask for the next gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ github.event.workflow_run.head_branch || inputs.from }}
        run: |
          set -euo pipefail
          TARGET=$([ "$FROM" = "develop" ] && echo "staging" || echo "main")
          echo "dispatching ci on $TARGET"

          # The status code is checked, not printed.
          #
          # A step that prints the code and exits 0 is a step that fails
          # silently, and this one did: the API answered 403 because the
          # token had no `actions: write`, and the ladder sat waiting for a
          # gate that was never going to run. A dispatch that did not happen
          # has to be a red run.
          code=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$TARGET\"}" \
            -o /tmp/dispatch.out -w '%{http_code}')

          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::could not dispatch ci on $TARGET (HTTP $code)"
            cat /tmp/dispatch.out || true
            exit 1
          fi
          echo "dispatched ci on $TARGET"
