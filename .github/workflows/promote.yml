name: promote

# The promotion ladder. A green build on `develop` becomes `staging`; a green
# build on `staging` becomes `main`; a change that reaches `main` ships through
# deploy.yml. Nothing promotes on a red gate, and the ladder only ever moves
# forward — it is a merge, never a rewrite, so the history says where each
# release came from.
#
# The trigger is `workflow_run`, not `push`: waiting on the *check suites of the
# pushed commit* deadlocks, because the gate's own suite is one of the pending
# suites it is waiting for. The completion event is also the honest moment to
# ask — ci.yml has already finished, and its conclusion is right there.

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [develop, staging]
  workflow_dispatch:
    inputs:
      from:
        description: "branch to promote (develop or staging)"
        required: true
        default: develop

concurrency:
  group: promote-${{ github.event.workflow_run.head_branch || inputs.from }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, linux, X64, crucible]
    # The merge pushes to the repo, so the job's token needs contents:write.
    # Declared here rather than inherited from the repository default: a
    # setting a reviewer cannot see in the diff is a setting the next repo
    # will not have.
    #
    # `actions: write` is the other half, and its absence was silent: the job
    # asked for the next gate with a token that could not, the API answered
    # 403, and the step printed the code and exited 0. The ladder then sat
    # waiting for a gate that was never going to run, and nothing said so.
    permissions:
      contents: write
      actions: write
      # Promotion merges a branch that can contain workflow edits, and GitHub
      # refuses an App token that writes `.github/workflows/*` without this
      # scope: `! [remote rejected] main -> main (refusing to allow a GitHub
      # App to create or update workflow ... without 'workflows' permission)`.
      # Declaring it here is necessary but not sufficient — the repository's
      # Actions ceiling has to allow a workflow to hold it, and a read-only
      # ceiling silently caps this back down.
      workflows: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || inputs.from }}

      - name: refuse a red gate
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "ci concluded '${{ github.event.workflow_run.conclusion }}' on ${{ github.event.workflow_run.head_branch }}; promotion refused"
          exit 1

      # The promotion must never merge a commit whose own CI is not green.
      #
      # The workflow_run event is not enough: a workflow_dispatch promotion has
      # no conclusion to read, and the post-dispatch wait can race the run-id
      # lookup. This check binds the merge to the exact source commit and waits
      # for its latest ci run. A queued or running gate is a wait; a cancelled
      # or failed gate is a stop.
      - name: wait for the source gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FROM=${{ github.event.workflow_run.head_branch || inputs.from }}
          SHA=$(git rev-parse HEAD)
          echo "waiting for ci on $FROM at $SHA"
          for _ in $(seq 1 60); do
            RESULT=$(gh run list \
              --workflow ci.yml \
              --commit "$SHA" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0] | (.status + "/" + (.conclusion // ""))' 2>/dev/null || true)
            case "$RESULT" in
              completed/success)
                echo "source gate is green"
                exit 0
                ;;
              completed/*)
                echo "::error::ci on $FROM at $SHA is $RESULT"
                exit 1
                ;;
              "")
                echo "no ci run yet for $SHA"
                ;;
              *)
                echo "waiting: $RESULT"
                ;;
            esac
            sleep 10
          done
          echo "::error::timed out waiting for ci on $FROM at $SHA"
          exit 1

      - name: merge forward
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FROM=${{ github.event.workflow_run.head_branch || inputs.from }}
          TARGET=$([ "$FROM" = "develop" ] && echo "staging" || echo "main")

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch origin "$FROM" "$TARGET"
          # The commit being promoted is the head of the branch it is promoted
          # from — read from origin, because a workflow_run's head_sha is the
          # ci run's checkout, which is the same commit but not always the same
          # ref a hand-dispatch starts from.
          SHA=$(git rev-parse "origin/$FROM")

          echo "promoting $FROM ($SHA) -> $TARGET"

          git switch -C "$TARGET" "origin/$TARGET"

          # Nothing to promote is a normal state, not a failure — and it must
          # not dispatch a gate. The gate would complete, which would raise
          # this workflow again, which would dispatch the gate again. The
          # ladder would run forever on a chain that is already current.
          if git merge-base --is-ancestor "$SHA" "origin/$TARGET"; then
            echo "already promoted: $SHA is in $TARGET, nothing to do"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A conflict must not be able to wedge the ladder.
          #
          # `staging` and `main` are write-only: nothing edits them except this
          # job, so their content is always a snapshot of some `develop` state
          # and never contains intent that `develop` lacks. When the two
          # branches touch the same lines — the same change committed
          # independently on both, which is how this happened once — the
          # promotion source is the one carrying the newer intent, so the
          # conflicting hunks are taken from it. Everything that is not in
          # conflict is still merged from both sides.
          #
          # Without this, one conflicting line on `staging` refused every
          # promotion for eight days and production kept serving an old build,
          # because the only way forward was a human noticing a red pipeline.
          if ! git merge --no-ff "$SHA" -m "chore(promote): $FROM -> $TARGET"; then
            echo "::warning::merge conflicted; resolving in favour of $FROM (the promotion source)"
            git merge --abort
            git merge --no-ff -X theirs "$SHA" \
              -m "chore(promote): $FROM -> $TARGET (conflicts resolved in favour of $FROM)"
          fi

          git push origin "$TARGET"
          echo "promoted $FROM to $TARGET"
          echo "promoted=true" >> "$GITHUB_OUTPUT"

      # The next rung of the ladder, asked for and waited for explicitly.
      #
      # A push made with GITHUB_TOKEN does not raise a `push` event — GitHub
      # suppresses it so a workflow cannot make itself loop. That suppression
      # is why the ladder used to stop one rung short: the promotion wrote
      # `staging`, nothing noticed, and no gate ever ran on it.
      #
      # `workflow_dispatch` is the documented exception to the suppression, so
      # the promotion asks for the next gate by name. What the ladder's notes
      # got wrong is the second half: a `workflow_dispatch` run's completion
      # does not reliably raise the `workflow_run` this workflow listens to.
      # The run appeared, passed, and no promotion to `main` followed, and the
      # main gate's completion did not dispatch the deploy either. The repair
      # is to hold this job while the gate it asked for runs, then ask for the
      # next step by name. The extra job duration is the cost of not trusting
      # an event that did not arrive.
      - name: ask for the next gate
        if: steps.merge.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ github.event.workflow_run.head_branch || inputs.from }}
        run: |
          set -euo pipefail
          TARGET=$([ "$FROM" = "develop" ] && echo "staging" || echo "main")
          # The dispatch endpoint returns no run id. Record the newest run of
          # this kind before dispatching, then wait for a run with a greater id;
          # otherwise the lookup can pick up the previous run and "wait" on an
          # already-green result while the new gate is still queued.
          BEFORE=$(gh run list \
            --workflow ci.yml \
            --branch "$TARGET" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0' 2>/dev/null || echo 0)
          echo "dispatching ci on $TARGET"

          # The status code is checked, not printed.
          #
          # A step that prints the code and exits 0 is a step that fails
          # silently, and this one did: the API answered 403 because the
          # token had no `actions: write`, and the ladder sat waiting for a
          # gate that was never going to run. A dispatch that did not happen
          # has to be a red run.
          code=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"$TARGET\"}" \
            -o /tmp/dispatch.out -w '%{http_code}')

          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::error::could not dispatch ci on $TARGET (HTTP $code)"
            cat /tmp/dispatch.out || true
            exit 1
          fi
          echo "dispatched ci on $TARGET"

          # Find the run we just asked for: a workflow_dispatch ci run on this
          # branch with an id greater than the pre-dispatch newest.
          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID=$(gh run list \
              --workflow ci.yml \
              --branch "$TARGET" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId \
              --jq '.[].databaseId' 2>/dev/null | sort -nr | while read -r id; do
                if [ "$id" -gt "$BEFORE" ]; then echo "$id"; break; fi
              done || true)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 3
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::could not find the dispatched ci run on $TARGET"
            exit 1
          fi

          echo "waiting for ci run $RUN_ID on $TARGET"
          if ! gh run watch "$RUN_ID" --exit-status --interval 10; then
            echo "::error::ci on $TARGET failed; the ladder stops here"
            exit 1
          fi

          # The gate is green. Ask for the next step by name, rather than
          # waiting for an event that may never be delivered.
          if [ "$TARGET" = "staging" ]; then
            echo "asking for promote staging -> main"
            gh workflow run promote.yml --ref main -f from=staging
          else
            echo "asking for deploy on main"
            gh workflow run deploy.yml --ref main
          fi
