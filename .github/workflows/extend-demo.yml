name: extend-demo

# Adds trials a visitor can act on to the chain the site is already serving.
#
# The seeded chain carries four settled trials: a hall worth reading, and nothing
# to do. A visitor who arrives has no trial to claim, nothing to break and nothing
# to wait for. This adds one trial open for claim and one claimed and awaiting a
# run, so the product is a market rather than a screenshot.
#
# It extends the chain in place. Nothing is redeployed, so the addresses the API
# and the web bundle already carry stay valid and the settled hall keeps pointing
# at the transactions that produced it.
#
# It runs inside the seed image, on the compose network, because the anvil
# container publishes no host port on the VPS override — the runner is not on that
# network, so it reaches anvil the way the stack does.

on:
  # Hourly, so the demo is always something a visitor can act on.
  #
  # The seed leaves four settled trials — a hall worth reading and nothing to
  # do. This tops the chain back up: a minimum number of trials open for a
  # claim, and one claimed and waiting for a run. It is idempotent, so it can
  # run on a timer without a growing pile of half-finished trials.
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be extended without sending a transaction"
        type: boolean
        default: false

concurrency:
  group: extend-demo
  cancel-in-progress: false

jobs:
  extend:
    name: Extend the live chain
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - name: read the deployed addresses
        id: addresses
        run: |
          set -euo pipefail
          cd "$HOME/crucible"
          if [ ! -f .env ]; then
            echo "::error::no .env on this host"
            exit 1
          fi
          trials=$(grep -E '^TRIALS_ADDRESS=' .env | tail -n 1 | cut -d= -f2- | tr -d '[:space:]')
          if [ -z "$trials" ]; then
            echo "::error::TRIALS_ADDRESS is not set in .env"
            exit 1
          fi
          echo "trials=$trials" >> "$GITHUB_OUTPUT"
          echo "chain carries $trials"

      - name: build the seed image
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$HOME/crucible"
          docker compose -f compose.yaml -f compose.vps.yaml build seed

      - name: extend the chain
        working-directory: ${{ github.workspace }}
        env:
          TRIALS: ${{ steps.addresses.outputs.trials }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cd "$HOME/crucible"

          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: the chain would be extended with two trials"
            docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps \
              --entrypoint cast \
              -e TRIALS_ADDRESS="$TRIALS" \
              seed call "$TRIALS" "trialCount()(uint256)" --rpc-url http://anvil:8545
            exit 0
          fi

          docker compose -f compose.yaml -f compose.vps.yaml run --rm --no-deps \
            --entrypoint forge \
            -e TRIALS_ADDRESS="$TRIALS" \
            seed script script/Extend.s.sol:Extend --rpc-url http://anvil:8545 --broadcast

      # Confirms the extension actually reached the read model.
      #
      # The previous version of this step was a warning on timeout, which understated the
      # problem twice over. First, "the chain grew and nothing can act on it" is exactly
      # the failure this job exists to prevent, so it must be red. Second, and worse: the
      # old step took `sed`'s no-match result — an empty string, produced when the API is
      # down, returns HTML, or renames `counts` — into the default `*)` case, printed
      # `counts: ` and exited 0. An unreachable API was reported as a confirmed one. So
      # this step now distinguishes three outcomes and treats the third as failure:
      # open > 0 (success), open == 0 (not yet caught up), and unreadable (not evidence).
      - name: confirm the API sees it
        run: |
          set -euo pipefail
          url="https://crucible.svalley.tech/api/snapshot"
          confirmed=0
          last="never read"

          for i in $(seq 1 20); do
            body=""
            body=$(curl -sk --max-time 10 "$url") || body=""

            # Prints the open count, or a token naming why there is no count. The token
            # is deliberate: a missing measurement must say it is missing rather than
            # becoming a zero.
            open=$(printf '%s' "$body" | node -e '
              let s = "";
              process.stdin.on("data", (d) => (s += d));
              process.stdin.on("end", () => {
                if (!s.trim()) { console.log("NO_RESPONSE"); return; }
                let j;
                try { j = JSON.parse(s); } catch { console.log("NOT_JSON"); return; }
                const c = j && j.counts;
                if (!c || typeof c.open !== "number") { console.log("NO_COUNTS_FIELD"); return; }
                console.log(String(c.open));
              });
            ') || open="NODE_FAILED"

            case "$open" in
              NO_RESPONSE|NOT_JSON|NO_COUNTS_FIELD|NODE_FAILED)
                last="unreadable ($open)"
                echo "snapshot is $last — not evidence the API sees the trials (attempt $i)"
                sleep 5
                ;;
              0)
                last="open trials 0"
                echo "chain extended but the API still reports no open trial (attempt $i)"
                sleep 5
                ;;
              *)
                last="open trials $open"
                echo "confirmed: the API reports $open open trial(s)"
                confirmed=1
                break
                ;;
            esac
          done

          if [ "$confirmed" -ne 1 ]; then
            echo "::error::the chain was extended but the live site did not confirm it " \
                 "(last reading: $last). Visitors still have nothing to act on, or the " \
                 "indexer is not serving what the chain holds — either way this job did " \
                 "not do its work."
            exit 1
          fi
