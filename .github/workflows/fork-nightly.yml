name: fork-nightly

# Exercises the ERC-8004 bridge against the registry as it is actually deployed.
#
# The default `ci` workflow has a fork job that skips when there is no
# `MAINNET_RPC_URL`, and it skips quietly: the check goes green having asserted
# nothing. That is the shape of gate this repo keeps having to find and remove —
# HARDENING.md's own open list says the bridge "has never been exercised against
# the registry as actually deployed, only against the mock".
#
# Splitting it is the fix. Keeping fork coverage inside the PR gate would make a
# third party's RPC uptime decide whether a pull request can merge, which is not a
# gate, it is a lottery. So the PR job stays optional and loudly honest about
# skipping, and this job carries the actual obligation:
#
#   * it runs on a schedule, when nobody is waiting on it;
#   * a missing `MAINNET_RPC_URL` FAILS here rather than skipping. This job exists
#     only to run those tests; a version of it that runs nothing and reports
#     success is the exact failure mode it was written to remove;
#   * a real forge failure is a real red, so the four `vm.skip` guards in
#     `test/Fork.t.sol` cannot silently convert "not checked" into "checked".

on:
  # 03:17 UTC daily. Off the hour and off the half hour on purpose: the runner
  # box also hosts the production anvil and the hourly `extend-demo`, and a
  # scheduled job that collides with a deploy looks like a flaky test.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fork-nightly
  cancel-in-progress: false

jobs:
  fork:
    name: Fork tests (ERC-8004 mainnet)
    runs-on: [self-hosted, linux, X64, crucible]
    defaults:
      run:
        working-directory: crucible-contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install foundry (digest-pinned tarball)
        run: |
          set -euo pipefail
          # Per-job private directory, same reason as ci.yml: three jobs extracting
          # into /tmp raced on the same `forge` binary and failed with "Text file
          # busy", a different job each time. The digest is verified by
          # scripts/install-tool.sh before anything is unpacked.
          FOUNDRY_DIR="$RUNNER_TEMP/foundry"
          bash "$GITHUB_WORKSPACE/scripts/install-tool.sh" foundry "$FOUNDRY_DIR"
          echo "$FOUNDRY_DIR" >> "$GITHUB_PATH"
          export PATH="$FOUNDRY_DIR:$PATH"
          forge --version

      # The refusal is the point of this job. `ci.yml` may skip when the credential
      # is absent because it has other work to do; this job has nothing else to do,
      # so an absent credential means the obligation went unmet and must be red.
      #
      # The endpoint is configuration, not a secret, and this repository has never had an
      # Actions secret set at all — which is why every scheduled nightly was red. The runner is
      # the deployment box, and the deployment box already holds both endpoints in its `.env`.
      # Read them from there when no secret supplies them, so one value keeps one owner, and say
      # in the log which source answered. Absent from both is still a hard refusal.
      - name: resolve the mainnet endpoints
        env:
          SECRET_MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SECRET_MAINNET_RPC_FALLBACK_URL: ${{ secrets.MAINNET_RPC_FALLBACK_URL }}
        run: |
          set -euo pipefail
          deploy_env="/home/ubuntu/crucible/.env"

          read_key() {
            # Only the named key is ever printed; the file holds credentials this job must not
            # put in its own log.
            [ -f "$deploy_env" ] || return 0
            grep -m1 "^$1=" "$deploy_env" | cut -d= -f2- || true
          }

          url="${SECRET_MAINNET_RPC_URL:-$(read_key MAINNET_RPC_URL)}"
          fallback="${SECRET_MAINNET_RPC_FALLBACK_URL:-$(read_key MAINNET_RPC_FALLBACK_URL)}"

          if [ -z "$url" ]; then
            echo "::error::MAINNET_RPC_URL is configured nowhere — no Actions secret, and no" \
                 "$deploy_env key either — so the ERC-8004 fork tests cannot run. This is the" \
                 "job whose only purpose is to run them; a green nightly here would mean the" \
                 "bridge went a full day unexercised."
            exit 1
          fi

          echo "MAINNET_RPC_URL=$url" >> "$GITHUB_ENV"
          if [ -n "$fallback" ]; then echo "MAINNET_RPC_FALLBACK_URL=$fallback" >> "$GITHUB_ENV"; fi
          echo "primary: $url"
          echo "fallback: ${fallback:-none}"
          echo "source: $([ -n "${SECRET_MAINNET_RPC_URL:-}" ] && echo 'Actions secret' || echo "the deployment .env on this runner")"

      - name: fork tests
        run: |
          set -euo pipefail
          # `npm run fork:test` rather than one `forge --fork-url`: it tries the primary and only
          # then the fallback, which is the measured fact here — on 2026-10-26 both endpoints
          # report chain id 1, but publicnode had pruned block 24,846,426 and only drpc could
          # serve the fork. A single hard-wired URL would have called that a broken bridge.
          #
          # Assert the tests actually ran: four of them are guarded by `vm.skip`
          # when no fork is attached, and a run that reported "4 skipped" here would
          # be the same silent green this job exists to eliminate.
          output=$(npm run --silent fork:test 2>&1)
          echo "$output"
          if ! echo "$output" | grep -qE "[1-9][0-9]* (tests )?passed"; then
            echo "::error::the fork suite reported no passing tests — it ran but" \
                 "asserted nothing. Check the vm.skip guard and the fork URLs."
            exit 1
          fi
