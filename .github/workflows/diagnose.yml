name: diagnose

# Read-only inspection of the deployment host.
#
# The runner IS the VPS: the deploy job builds and swaps the stack on the
# machine that serves crucible.svalley.tech. That makes the runner the only
# way to look at the box without an SSH key, and it is the honest place to
# look, because a gate that fails only on that host has to be understood on
# that host.
#
# Nothing here mutates anything. It prints, and exits.

on:
  workflow_dispatch:
    inputs:
      include_logs:
        description: "Dump the api/anvil container logs (last 80 lines each)"
        type: boolean
        default: true

concurrency:
  group: diagnose
  cancel-in-progress: false

jobs:
  host:
    name: Host state
    runs-on: [self-hosted, linux, X64, crucible]
    steps:
      - name: identity
        run: |
          set -uo pipefail
          echo "=== identity ==="
          echo "hostname: $(hostname)"
          echo "date:     $(date -Is)"
          echo "uptime:   $(uptime)"
          echo "kernel:   $(uname -a)"
          echo "user:     $(whoami)"

      - name: cpu and memory
        run: |
          set -uo pipefail
          echo "=== cpu ==="
          nproc
          echo "loadavg: $(cat /proc/loadavg)"
          echo "=== memory ==="
          free -m
          echo "=== swap activity (si/so are the thrash counters) ==="
          vmstat 1 3 | tail -2
          echo "=== top memory consumers ==="
          ps -eo pid,ppid,%cpu,%mem,rss,comm --sort=-rss | head -15

      - name: disk
        run: |
          set -uo pipefail
          echo "=== disk ==="
          df -h / /home 2>/dev/null || df -h
          echo "=== inodes ==="
          df -i / 2>/dev/null || true
          echo "=== biggest directories under /home ==="
          du -xh --max-depth=2 /home/ubuntu 2>/dev/null | sort -h | tail -15

      - name: docker
        run: |
          set -uo pipefail
          echo "=== containers ==="
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' 2>&1
          echo "=== compose stacks ==="
          docker compose ls 2>&1 || true
          echo "=== image / volume / build cache ==="
          docker system df 2>&1
          echo "=== live resource use ==="
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' 2>&1 | head -20

      - name: the deployed stack
        run: |
          set -uo pipefail
          cd "$HOME/crucible" 2>/dev/null || { echo "no ~/crucible on this host"; exit 0; }
          echo "=== deployed tree ==="
          git -C . rev-parse --short HEAD 2>&1 || echo "not a git checkout"
          git -C . log -1 --format='%h %s (%ci)' 2>&1 || true
          echo "=== .env keys present (values redacted) ==="
          if [ -f .env ]; then
            sed -E 's/=.*/=<redacted>/' .env
          else
            echo "no .env"
          fi
          echo "=== services ==="
          docker compose -f compose.yaml -f compose.vps.yaml ps 2>&1 || true

      - name: container logs
        if: ${{ inputs.include_logs }}
        run: |
          set -uo pipefail
          for svc in api web anvil; do
            echo "=== logs: $svc ==="
            docker logs --tail 80 "$svc" 2>&1 | tail -80 || echo "no container named $svc"
            echo
          done

      - name: the slow benchmark, on this host
        run: |
          set -uo pipefail
          cd "$HOME/crucible" 2>/dev/null || exit 0
          echo "=== free -m before ==="
          free -m
          echo "=== node heap ceiling ==="
          node -e "console.log('heap limit MB:', require('v8').getHeapStatistics().heap_size_limit/1048576)"
          echo "=== the indexer backfill bench ==="
          if [ -f packages/indexer/scripts/bench-backfill.ts ]; then
            npx tsx packages/indexer/scripts/bench-backfill.ts 2>&1 | tail -20
          else
            echo "bench script not present on this checkout"
          fi
          echo "=== free -m after ==="
          free -m
