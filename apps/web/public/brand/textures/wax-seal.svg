<?xml version="1.0" encoding="UTF-8"?>
<!-- Wax seal texture: subtle impressed-wax pattern for verdict stamps and seals.
     viewBox 0 0 200 200. Tileable. Warm wax tone with impressed line detail. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="wax-impress" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0  0.7 0.5 0.3 0 0  0.4 0.25 0.1 0 0  0 0 0 0.6 0" in="noise" result="waxColor"/>
      <feBlend mode="multiply" in="waxColor" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#A07E49" filter="url(#wax-impress)"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#8a6b3f" stroke-width="2" opacity="0.5"/>
  <path d="M 60 100 Q 100 60 140 100 M 100 60 Q 140 100 100 140 M 100 140 Q 60 100 100 60 M 60 100 Q 100 140 140 100" fill="none" stroke="#8a6b3f" stroke-width="1" opacity="0.3"/>
</svg>
