<?xml version="1.0" encoding="UTF-8"?>
<!-- Bronze texture: subtle brushed-metal grain for raised metal surfaces.
     viewBox 0 0 200 200. Tileable. Laurel bronze (#A07E49) base. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="bronze-brush" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.05" numOctaves="2" stitchTiles="noStitch" result="brush"/>
      <feColorMatrix type="matrix" values="1 0 0 0 0  0.8 0.6 0.3 0 0  0.4 0.3 0.1 0 0  0 0 0 0.5 0" in="brush" result="brushColor"/>
      <feBlend mode="multiply" in="brushColor" in2="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="200" height="200" fill="#A07E49" filter="url(#bronze-brush)"/>
  <path d="M 0 50 L 200 50 M 0 120 L 200 120 M 0 170 L 200 170" fill="none" stroke="#8a6b3f" stroke-width="0.5" opacity="0.3"/>
</svg>
