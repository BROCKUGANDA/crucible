<?xml version="1.0" encoding="UTF-8"?>
<!-- Settlement emblem: pull-ledger settlement mark. Hand reaching into a bag / coin
     stack within a circle. Verdict gold (#E3B25C). viewBox 0 0 400 400. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Settlement emblem">
  <title>Settlement emblem</title>
  <desc>Settlement emblem: pull-ledger payout mark. Coin stack with withdrawing hand,
  verdict gold, signaling the recipient calls withdraw() in a separate transaction.</desc>
  <circle cx="200" cy="200" r="170" fill="none" stroke="#A07E49" stroke-width="12"/>
  <!-- Coin stack -->
  <ellipse cx="200" cy="150" rx="50" ry="22" fill="#E3B25C"/>
  <ellipse cx="200" cy="150" rx="50" ry="22" fill="none" stroke="#8a6b3f" stroke-width="3"/>
  <ellipse cx="200" cy="178" rx="44" ry="18" fill="#E3B25C"/>
  <ellipse cx="200" cy="178" rx="44" ry="18" fill="none" stroke="#8a6b3f" stroke-width="3"/>
  <ellipse cx="200" cy="202" rx="38" ry="14" fill="#E3B25C"/>
  <ellipse cx="200" cy="202" rx="38" ry="14" fill="none" stroke="#8a6b3f" stroke-width="3"/>
  <!-- Withdrawal mark (small hand/arrow reaching up) -->
  <path d="M 200 240 L 200 290 Q 200 310 185 310 L 185 330 L 215 330 L 215 310 Q 200 310 200 290" fill="none" stroke="#E3B25C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="200" y="365" font-family="Cinzel, serif" font-size="24" fill="#D7C6A5" text-anchor="middle" letter-spacing="3">SETTLED</text>
</svg>
