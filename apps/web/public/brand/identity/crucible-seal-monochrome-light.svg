  <title>Crucible seal — monochrome light</title>
  <desc>Monochrome light variant of the master Crucible seal. Single marble linework
  (#F2EAD9) on transparent background.</desc>
  <circle cx="500" cy="500" r="470" fill="none" stroke="#F2EAD9" stroke-width="20"/>
  <circle cx="500" cy="500" r="442" fill="none" stroke="#F2EAD9" stroke-width="10"/>
  <circle cx="500" cy="500" r="428" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <circle cx="500" cy="500" r="390" fill="none" stroke="#F2EAD9" stroke-width="8"/>
  <path d="M 180 700 Q 140 500 180 320" fill="none" stroke="#F2EAD9" stroke-width="16" stroke-linecap="round"/>
  <path d="M 180 700 Q 260 720 380 560" fill="none" stroke="#F2EAD9" stroke-width="14" stroke-linecap="round"/>
  <path d="M 820 700 Q 860 500 820 320" fill="none" stroke="#F2EAD9" stroke-width="16" stroke-linecap="round"/>
  <path d="M 820 700 Q 740 720 620 560" fill="none" stroke="#F2EAD9" stroke-width="14" stroke-linecap="round"/>
  <ellipse cx="210" cy="420" rx="10" ry="20" transform="rotate(-40 210 420)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <ellipse cx="240" cy="360" rx="10" ry="20" transform="rotate(-55 240 360)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <ellipse cx="275" cy="320" rx="10" ry="20" transform="rotate(-70 275 320)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <ellipse cx="730" cy="420" rx="10" ry="20" transform="rotate(40 730 420)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <ellipse cx="760" cy="360" rx="10" ry="20" transform="rotate(55 760 360)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <ellipse cx="725" cy="320" rx="10" ry="20" transform="rotate(70 725 320)" fill="none" stroke="#F2EAD9" stroke-width="4"/>
  <path d="M 440 560 L 560 560 L 500 680 Z" fill="none" stroke="#F2EAD9" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 470 680 Q 485 620 500 590 Q 515 620 530 680 Q 510 660 500 650 Q 490 660 470 680 Z" fill="none" stroke="#F2EAD9" stroke-width="6" stroke-linejoin="round"/>
