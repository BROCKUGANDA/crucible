<?xml version="1.0" encoding="UTF-8"?>
<!-- Master Crucible seal. Institutional circular seal evoking Roman civic authority.
     viewBox 0 0 1000 1000. Outer ring: double-banded stone circle. Inner: laurel wreath
     framing the crucible bowl (inverted triangle over flame) with the word CRUCIBLE
     inscribed around the upper arc. Accessible title/desc included. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Crucible institutional seal">
  <title>Crucible seal</title>
  <desc>Master institutional seal: double-banded stone ring, laurel wreath, crucible bowl
  over flame, "CRUCIBLE" inscription on upper arc. Obsidian (#0B0A09), marble (#F2EAD9),
  laurel bronze (#A07E49), verdict gold (#E3B25C).</desc>
  <defs>
    <!-- Bronze bevel for raised-metal look on the seal face -->
    <radialGradient id="seal-face" cx="50%" cy="50%" r="50%" fx="45%" fy="45%">
      <stop offset="0%" stop-color="#151210"/>
      <stop offset="60%" stop-color="#0B0A09"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>
    <linearGradient id="bronze-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A07E49"/>
      <stop offset="50%" stop-color="#8a6b3f"/>
      <stop offset="100%" stop-color="#70552e"/>
    </linearGradient>
    <filter id="seal-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer stone ring (double band) -->
  <circle cx="500" cy="500" r="470" fill="none" stroke="#25201B" stroke-width="28"/>
  <circle cx="500" cy="500" r="442" fill="none" stroke="#A07E49" stroke-width="14"/>

  <!-- Seal face -->
  <circle cx="500" cy="500" r="428" fill="url(#seal-face)" filter="url(#seal-shadow)"/>

  <!-- Inner stone boundary -->
  <circle cx="500" cy="500" r="390" fill="none" stroke="#151210" stroke-width="10"/>

  <!-- Laurel wreath: two curved branches meeting at bottom, leaves along the arc -->
  <g fill="#8a6b3f" stroke="#A07E49" stroke-width="6" stroke-linecap="round">
    <!-- Left branch arc -->
    <path d="M 180 700 Q 140 500 180 320" fill="none" stroke="#A07E49" stroke-width="22" stroke-linecap="round"/>
    <path d="M 180 700 Q 260 720 380 560" fill="none" stroke="#A07E49" stroke-width="20" stroke-linecap="round"/>
    <!-- Right branch arc -->
    <path d="M 820 700 Q 860 500 820 320" fill="none" stroke="#A07E49" stroke-width="22" stroke-linecap="round"/>
    <path d="M 820 700 Q 740 720 620 560" fill="none" stroke="#A07E49" stroke-width="20" stroke-linecap="round"/>
    <!-- Individual leaves along the wreath (stylized teardrops) -->
    <ellipse cx="210" cy="420" rx="14" ry="28" transform="rotate(-40 210 420)"/>
    <ellipse cx="240" cy="360" rx="14" ry="28" transform="rotate(-55 240 360)"/>
    <ellipse cx="275" cy="320" rx="14" ry="28" transform="rotate(-70 275 320)"/>
    <ellipse cx="730" cy="420" rx="14" ry="28" transform="rotate(40 730 420)"/>
    <ellipse cx="760" cy="360" rx="14" ry="28" transform="rotate(55 760 360)"/>
    <ellipse cx="725" cy="320" rx="14" ry="28" transform="rotate(70 725 320)"/>
  </g>

  <!-- Crucible bowl: inverted triangle held above flame -->
  <path d="M 440 560 L 560 560 L 500 680 Z" fill="#151210" stroke="#A07E49" stroke-width="10" stroke-linejoin="round"/>
  <!-- Flame inside bowl -->
  <path d="M 470 680 Q 485 620 500 590 Q 515 620 530 680 Q 510 660 500 650 Q 490 660 470 680 Z" fill="#E2612F"/>
  <path d="M 485 660 Q 495 625 500 610 Q 505 625 515 660 Q 505 650 500 640 Q 495 650 485 660 Z" fill="#FBEEDA"/>

  <!-- Inscription: CRUCIBLE along upper arc (simulated with rotated characters) -->
  <g fill="#F2EAD9" font-family="Cinzel, Trajan Pro, Georgia, serif" font-size="42" font-weight="700" letter-spacing="6" text-anchor="middle">
    <text x="500" y="230" transform="rotate(-26 500 230)">C</text>
    <text x="500" y="230" transform="rotate(-18 500 230)">R</text>
    <text x="500" y="230" transform="rotate(-10 500 230)">U</text>
    <text x="500" y="230" transform="rotate(-2 500 230)">C</text>
    <text x="500" y="230" transform="rotate(6 500 230)">I</text>
    <text x="500" y="230" transform="rotate(14 500 230)">B</text>
    <text x="500" y="230" transform="rotate(22 500 230)">L</text>
    <text x="500" y="230" transform="rotate(30 500 230)">E</text>
  </g>

  <!-- Base line: institution founding mark at bottom -->
  <path d="M 400 860 Q 500 880 600 860" fill="none" stroke="#A07E49" stroke-width="12" stroke-linecap="round"/>
  <circle cx="500" cy="860" r="8" fill="#E3B25C"/>

  <!-- Registry line at very bottom edge -->
  <circle cx="500" cy="940" r="30" fill="none" stroke="#A07E49" stroke-width="6"/>
  <text x="500" y="952" font-family="Cinzel, serif" font-size="24" fill="#D7C6A5" text-anchor="middle" letter-spacing="2">ARENA OF PROOF</text>
</svg>
