[workspace]
members = ["programs/*"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[profile.release]
overflow-checks = true

# The SBF target profile mirrors Anchor's defaults; overflow-checks stays on in
# debug too so a host `cargo test` exercises the same panic-on-overflow posture
# the chain enforces via checked math in math.rs (gate 710).
[profile.dev]
overflow-checks = true
