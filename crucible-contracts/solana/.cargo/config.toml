# Gate 701 artifact — the MSRV fallback the pinned-toolchain note names.
#
# SBF platform-tools v1.51 carries rustc 1.84; some late-2025 transitive crates
# declare edition-2024 (rust-version >= 1.85). This option makes cargo's
# resolver prefer the newest version of each crate whose declared rust-version
# the build rustc actually satisfies, instead of failing the resolve. The
# blake3 1.5.1 pin (scripts/toolchain-pin.sh) handles the one crate that
# needed an explicit floor. Do not float platform-tools without re-running
# the end-to-end suite.
[resolver]
incompatible-rust-versions = "fallback"
