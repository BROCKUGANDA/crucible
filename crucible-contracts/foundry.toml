[profile.default]
solc = "0.8.26"
optimizer = true
optimizer_runs = 10_000
# Required, not cosmetic: `getTrial`/`getAgent` return 15-field structs by memory, and the
# EIP-712 / settle paths hold many live locals. Under solc's legacy codegen that overflows
# the 16-slot stack the moment any external file references the contract.
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[invariant]
runs = 128
depth = 64

[fuzz]
runs = 512

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"

# Fork tests are opt-in, not part of the default gate.
#
# Two reasons. They need a live RPC, and CI should not depend on a third party's uptime
# to know the contracts are sound. And they are the slow ones. What they buy — proof that
# the ERC-8004 bridge works against the registry as actually deployed, rather than
# against our mock — is exactly what a unit test cannot tell you.
#
#   MAINNET_RPC_URL=https://... forge test --fork-url mainnet --fork-block-number <n> \
#     --match-contract Fork
[profile.fork.fuzz]
runs = 32

[profile.fork.invariant]
runs = 32
depth = 32
